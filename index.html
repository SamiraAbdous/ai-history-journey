<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>مقدمة في الذكاء الاصطناعي — الوحدات التفاعلية</title>
<meta name="description" content="وحدات تعليمية تفاعلية ثنائية اللغة (عربي/إنجليزي) لمقياس مقدمة في الذكاء الاصطناعي — من إعداد د. سميرة عبدوس، جامعة أمحمد بوقرة بومرداس.">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Changa:wght@600;700;800&family=Tajawal:wght@400;500;700&display=swap">
<link rel="stylesheet" href="assets/app.css">
<style>
.mods{display:grid;gap:10px;margin-top:14px}
.mod{display:grid;grid-template-columns:52px 1fr;gap:12px;background:var(--paper);border:1px solid var(--line);border-radius:14px;padding:12px 14px;text-decoration:none;color:var(--fg);transition:border-color .15s}
.mod:hover{border-color:var(--accent)}
.mod:focus-visible{outline:2px solid var(--accent)}
.mod .ic{width:52px;height:52px;border-radius:14px;display:grid;place-items:center;font-size:26px;background:var(--accent-soft);border:1px solid var(--line)}
.mod .tt2{font-family:var(--display);font-weight:700;color:var(--ink);font-size:17px;line-height:1.3}
.mod .lec{font-size:12px;color:var(--muted);display:block;margin-bottom:2px}
.mod .fmt{font-size:13px;color:var(--fg)}
.mod .pr{display:flex;gap:8px;align-items:center;margin-top:6px;font-size:12px;color:var(--muted)}
.mod .pr i{flex:1;height:6px;background:var(--line);border-radius:99px;overflow:hidden;display:block}
.mod .pr i b{display:block;height:100%;background:linear-gradient(90deg,var(--accent),var(--gold))}
.mod.soon{opacity:.55}
.mod .badge{margin-inline-start:6px}
.intro{background:var(--paper);border:1px solid var(--line);border-radius:12px;padding:12px 14px;font-size:15px}
</style>
</head>
<body>
<div class="wrap">
  <div class="topbar"><span class="eyebrow" id="uiEyebrow"></span>
    <div class="langbar" role="group" aria-label="Language"><button type="button" data-lang="ar">العربية</button><button type="button" data-lang="en">English</button></div></div>
  <header class="top"><h1 id="uiTitle"></h1><p class="byline" id="uiByline"></p><p class="sub" id="uiSub"></p></header>
  <div class="intro" id="uiIntro"></div>
  <div class="mods" id="mods"></div>
  <div class="foot"><span id="uiFoot"></span><span id="uiName"></span></div>
</div>
<script>
const UI={
 ar:{eyebrow:'مقدمة في الذكاء الاصطناعي · السنة الثانية ليسانس علوم اقتصادية',title:'الوحدات التفاعلية للمقياس',byline:'من إعداد الدكتورة عبدوس سميرة',
  sub:'ثماني وحدات تغطي المحاور الثلاثة عشر، كل واحدة بأسلوب مختلف: لعبة، محاكاة، ورشة، أو قرار. اختر وحدة وابدأ؛ تقدمك يُحفظ على جهازك.',
  intro:'<b>كيف تستعملها؟</b> ابدأ بالوحدة التي تتابع المحاضرة الحالية. في كل وحدة: شرح قصير، مصطلحات بثلاث لغات، نشاط تطبيقي، وتحدٍّ يفتح المرحلة التالية. الأخطاء تعرض الشرح فورًا ولا تُحتسب ضدك.',
  foot:'د. سميرة عبدوس · جامعة أمحمد بوقرة بومرداس',soon:'قريبًا',stages:'مراحل',done:'مكتملة',pts:'نقطة',hello:n=>`مرحبًا ${n}`,
  mods:{types:['ما الذكاء الاصطناعي؟ وأي نوع أمامك؟','المحوران 1 و3','لعبة فرز: صنّف أنظمة حقيقية في سلالها الصحيحة'],
        history:['رحلة تاريخ الذكاء الاصطناعي','المحور 2','خريطة طريق من 1943 إلى 2026 بتسع محطات'],
        'ml-factory':['مصنع التعلم الآلي','المحور 4','محاكاة: درّب مصنِّفًا بيدك وراقب الدقة والخطأ'],
        llm:['داخل النموذج اللغوي','محور النماذج اللغوية الكبيرة','محاكي التنبؤ بالكلمة التالية ودرجة الحرارة والهلوسة'],
        prompts:['ورشة الأوامر','محورا هندسة الأوامر وتقنياتها','ابنِ الأمر قطعة قطعة وقارن النتائج واكشف الحقن'],
        generation:['مختبر التوليد والتحقق','المحوران 8 و9','صيد الهلوسة، أمر الصورة، وقرار أمام تزييف صوتي'],
        manager:['أنت المدير','المحور 10','لعبة قرارات: الذكاء الاصطناعي في مؤسسة جزائرية'],
        committee:['لجنة الائتمان','المحاور 11 و12 و13','محاكاة في ثلاثة فصول: الإنصاف، البيانات والأمان، الرقابة البشرية']}},
 en:{eyebrow:'Introduction to Artificial Intelligence · 2nd-year Economics',title:'Interactive modules of the course',byline:'Prepared by Dr. Samira Abdous',
  sub:'Eight modules covering the thirteen topics, each in a different style: a game, a simulation, a workshop or a decision. Pick one and start; progress is saved on your device.',
  intro:'<b>How to use them:</b> start with the module that follows the current lecture. Each module has a short explanation, terms in three languages, a hands-on activity and a challenge that unlocks the next stage. Mistakes show the explanation at once and never count against you.',
  foot:"Dr. Samira Abdous · University M'hamed Bougara of Boumerdes",soon:'Coming soon',stages:'stages',done:'done',pts:'pts',hello:n=>`Welcome ${n}`,
  mods:{types:['What is AI, and which kind is this?','Topics 1 & 3','Sorting game: put real systems in the right buckets'],
        history:['A Journey Through AI History','Topic 2','A road map from 1943 to 2026 in nine stations'],
        'ml-factory':['The Machine Learning Factory','Topic 4','Simulation: train a classifier by hand and watch accuracy and error'],
        llm:['Inside the Language Model','Large language models topic','Next-token, temperature and hallucination simulator'],
        prompts:['The Prompt Workshop','Prompt engineering topics','Build a prompt piece by piece, compare outputs, spot injection'],
        generation:['Generation and Verification Lab','Topics 8 & 9','Hallucination hunt, image prompt, and a deepfake decision'],
        manager:['You Are the Manager','Topic 10','Decision game: AI in an Algerian firm'],
        committee:['The Credit Committee','Topics 11, 12 & 13','A three-act simulation: fairness, data and security, human oversight']}}
};
const MODS=[{slug:'types',ic:'🧭',n:4},{slug:'history',ic:'🗺️',n:10},{slug:'ml-factory',ic:'🏭',n:4},{slug:'llm',ic:'🧠',n:4},{slug:'prompts',ic:'🛠️',n:4},{slug:'generation',ic:'🧪',n:4},{slug:'manager',ic:'📈',n:4},{slug:'committee',ic:'⚖️',n:3}];
const READY=new Set(['types','history','ml-factory','llm','prompts','generation','manager','committee']);
let lang='ar';
try{const l=localStorage.getItem('course:lang');if(l==='en'||l==='ar')lang=l;}catch(e){}
function prog(slug,n){try{const r=localStorage.getItem('course:'+slug);if(!r)return{d:0,s:0};const o=JSON.parse(r);return{d:Object.keys(o.done||{}).length,s:o.score||0};}catch(e){return{d:0,s:0};}}
function render(){
  const t=UI[lang];document.documentElement.lang=lang;document.documentElement.dir=lang==='ar'?'rtl':'ltr';
  document.title=lang==='ar'?'مقدمة في الذكاء الاصطناعي — الوحدات التفاعلية':'Introduction to AI — Interactive modules';
  document.getElementById('uiEyebrow').textContent=t.eyebrow;document.getElementById('uiTitle').textContent=t.title;document.getElementById('uiByline').textContent=t.byline;document.getElementById('uiSub').textContent=t.sub;document.getElementById('uiIntro').innerHTML=t.intro;document.getElementById('uiFoot').textContent=t.foot;
  let nm='';try{nm=localStorage.getItem('course:name')||'';}catch(e){}
  document.getElementById('uiName').textContent=nm?t.hello(nm):'';
  document.querySelectorAll('.langbar button').forEach(b=>b.setAttribute('aria-pressed',String(b.dataset.lang===lang)));
  const box=document.getElementById('mods');box.innerHTML='';
  MODS.forEach(m=>{const [tt,lec,fmt]=t.mods[m.slug];const ready=READY.has(m.slug);const p=prog(m.slug,m.n);const pct=Math.round(p.d/m.n*100);
    const a=document.createElement(ready?'a':'div');a.className='mod'+(ready?'':' soon');if(ready)a.href='modules/'+m.slug+'/';
    a.innerHTML=`<div class="ic">${m.ic}</div><div><span class="lec">${lec}</span><div class="tt2">${tt}${ready?'':`<span class="badge warn">${t.soon}</span>`}</div><div class="fmt">${fmt}</div>
      ${ready?`<div class="pr"><i><b style="width:${pct}%"></b></i><span>${p.d}/${m.n} ${t.stages}${p.s?` · ${p.s} ${t.pts}`:''}</span></div>`:''}</div>`;
    box.appendChild(a);});
}
document.querySelectorAll('.langbar button').forEach(b=>b.addEventListener('click',()=>{lang=b.dataset.lang;try{localStorage.setItem('course:lang',lang);}catch(e){}render();}));
render();
</script>
</body>
</html>
