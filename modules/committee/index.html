<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>لجنة الأخلاقيات</title>
<meta name="description" content="محاكاة في ثلاثة فصول: تدقيق الإنصاف في نموذج ائتمان، تصنيف البيانات وكشف الهجمات، وتصميم رقابة بشرية حقيقية — من إعداد د. سميرة عبدوس.">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Changa:wght@600;700;800&family=Tajawal:wght@400;500;700&display=swap">
<link rel="stylesheet" href="../../assets/app.css">
<style>:root{--accent:#2B5F8E;--accent-soft:#D9E7F3}@media (prefers-color-scheme: dark){:root:not([data-theme="light"]){--accent:#7FB3E0;--accent-soft:#17304A}}
.tbl{width:100%;border-collapse:collapse;font-size:13px;margin:8px 0}
.tbl th,.tbl td{border:1px solid var(--line);padding:6px 4px;text-align:center}
.tbl th{background:var(--accent-soft);font-family:var(--display);font-weight:600}
.tbl td:first-child,.tbl th:first-child{text-align:start}
.qblock{margin:10px 0;padding:8px 10px;border:1px solid var(--line);border-radius:10px;background:var(--bg)}
.qblock h4{margin:0 0 6px;font-family:var(--display);font-size:14px}
.ctl{margin:8px 0;padding:8px 10px;border:1px solid var(--line);border-radius:10px;background:var(--bg)}
.ctl h4{margin:0 0 4px;font-family:var(--display);font-size:14px}
.slider{width:100%;accent-color:var(--accent)}
.dash{display:grid;grid-template-columns:1fr 1fr;gap:6px;font-size:12px;margin-top:8px}
.dash div{background:var(--paper);border:1px solid var(--line);border-radius:8px;padding:6px;text-align:center}
.dash b{display:block;font-size:18px;font-family:var(--display)}
.stamp{font-family:var(--display);font-size:15px;text-align:center;padding:8px;border-radius:10px;margin-top:8px}
.stamp.bad{background:#F8D7DA;color:#7A1F2B}.stamp.ok{background:#D4EDDA;color:#1F5A2E}
</style>
</head>
<body>
<script src="../../assets/engine.js"></script>
<script src="../../assets/widgets.js"></script>
<script>
(function(){
  Course.widget('audit',function(el,data,ctx){
    const L=ctx.L,ar=ctx.lang==='ar';let sel=new Set(),checked=false,ans={},graded=false;
    const lab=ar?{p1:'الجزء 1: حذف البنك عمودي الجنس والأصل. أي متغيرات متبقية تعمل وكلاء (Proxies) لصفة محمية؟ اختر كل ما ينطبق.',check:'تحقق من الوكلاء',p2:'الجزء 2: اقرأ نتائج النموذج حسب الفئة وأجب.',grade:'قيّم التدقيق',done:'انتهى التدقيق',score:'نقاط'}
                :{p1:'Part 1: the bank dropped the gender and origin columns. Which remaining variables act as proxies for a protected attribute? Select all that apply.',check:'Check the proxies',p2:'Part 2: read the model\'s results by group and answer.',grade:'Grade the audit',done:'Audit finished',score:'points'};
    function proxyScore(){const right=data.vars.filter(v=>v.proxy&&sel.has(v.id)).length,wrong=data.vars.filter(v=>!v.proxy&&sel.has(v.id)).length;return right>=3&&wrong<=1?1:0;}
    function render(){
      el.innerHTML=`<p class="hint">${lab.p1}</p><div class="chips">${data.vars.map(v=>`<button type="button" class="chip ${sel.has(v.id)?'sel':''} ${checked?(v.proxy?(sel.has(v.id)?'ok':'bad'):(sel.has(v.id)?'bad':'')):''}" data-v="${v.id}" ${checked?'disabled':''}>${L(v.t)}</button>`).join('')}</div>
      ${checked?`<div class="fb ${proxyScore()?'ok':'bad'}">${data.vars.filter(v=>v.proxy).map(v=>`<div><b>${L(v.t)}</b>: ${L(v.why)}</div>`).join('')}</div>`:`<div class="row"><button type="button" class="btn" id="chk" ${sel.size?'':'disabled'}>${lab.check}</button></div>`}
      ${checked?`<p class="hint" style="margin-top:12px">${lab.p2}</p><table class="tbl"><thead><tr><th></th>${data.groups.map(g=>`<th>${L(g)}</th>`).join('')}</tr></thead><tbody>${data.rows.map(r=>`<tr><td>${L(r.t)}</td>${r.v.map(x=>`<td>${x}</td>`).join('')}</tr>`).join('')}</tbody></table>
      ${data.qs.map((q,qi)=>`<div class="qblock"><h4>${L(q.q)}</h4><div class="chips">${q.o.map((o,oi)=>`<button type="button" class="chip ${ans[qi]===oi?'sel':''} ${graded&&ans[qi]===oi?(oi===q.a?'ok':'bad'):''}" data-q="${qi}" data-oi="${oi}" ${graded?'disabled':''}>${L(o)}</button>`).join('')}</div>${graded?`<div class="hint">${L(q.w)}</div>`:''}</div>`).join('')}
      ${graded?'':`<div class="row"><button type="button" class="btn" id="grd" ${Object.keys(ans).length===data.qs.length?'':'disabled'}>${lab.grade}</button></div>`}`:''}`;
      el.querySelectorAll('[data-v]').forEach(b=>b.addEventListener('click',()=>{if(checked)return;const id=b.dataset.v;sel.has(id)?sel.delete(id):sel.add(id);render();}));
      const c=el.querySelector('#chk');if(c)c.addEventListener('click',()=>{checked=true;render();});
      el.querySelectorAll('[data-oi]').forEach(b=>b.addEventListener('click',()=>{if(graded)return;ans[b.dataset.q]=+b.dataset.oi;render();}));
      const g=el.querySelector('#grd');if(g)g.addEventListener('click',()=>{graded=true;render();const s=proxyScore()+data.qs.filter((q,qi)=>ans[qi]===q.a).length;ctx.done(s,1+data.qs.length);});
    }
    if(ctx.state.done){el.innerHTML=`<p class="fb ok">${lab.done} — ${ctx.state.score} / ${ctx.state.max}</p>`;return;}
    render();
  });

  Course.widget('oversight',function(el,data,ctx){
    const L=ctx.L,ar=ctx.lang==='ar';let quota=20,info=0,auth=0,meas=0;
    const lab=ar?{intro:'موظف قروض يراجع توصيات النموذج الآلي. اضبط شروط العمل الأربعة وراقب هل الرقابة حقيقية أم ختم مطاطي.',quota:'الحصة: ملفات في الساعة',info:'المعلومة المعروضة',auth:'الصلاحية',meas:'القياس',ovr:'نسبة التجاوز الإجمالية',ovrUp:'تجاوز نحو القبول',ovrDn:'تجاوز نحو الرفض',time:'الوقت لكل ملف',rubber:'ختم مطاطي: الموظف يوقّع ما يقترحه النموذج',real:'رقابة بشرية فعلية',cond:'الشروط المتحققة',adopt:'اعتمد هذا التصميم',min:'دقيقة'}
                :{intro:'A loan officer reviews the model\'s recommendations. Set the four working conditions and watch whether oversight is real or a rubber stamp.',quota:'Quota: files per hour',info:'Information shown',auth:'Authority',meas:'Measurement',ovr:'Overall override rate',ovrUp:'Overrides towards approval',ovrDn:'Overrides towards rejection',time:'Time per file',rubber:'Rubber stamp: the officer signs whatever the model suggests',real:'Meaningful human oversight',cond:'Conditions met',adopt:'Adopt this design',min:'min'};
    const INFO=ar?['الدرجة فقط (41/100)','الدرجة + أهم ثلاثة أسباب','الدرجة + الأسباب + الملف الكامل']:['Score only (41/100)','Score + top three reasons','Score + reasons + full file'];
    const AUTH=ar?['يحتاج إذن المدير لكل مخالفة','يخالف بحرية لكن المخالفة تُحسب ضده','يخالف بحرية ويوثق السبب']:['Needs manager\'s permission to deviate','Free to deviate but deviations count against them','Free to deviate and documents the reason'];
    const MEAS=ar?['لا يُقاس شيء','تُقاس نسبة المطابقة فقط','تُقاس نسبة التجاوز في الاتجاهين وأسبابها']:['Nothing measured','Only agreement rate measured','Override rate in both directions and reasons measured'];
    function sim(){
      const t=60/quota;const timeOK=t>=8,infoOK=info>=1,authOK=auth===2,measOK=meas===2;
      let base=timeOK?(info===2?12:infoOK?9:4):(t>=4?(infoOK?5:2):1);
      if(auth===0)base*=0.3;else if(auth===1)base*=0.5;
      let up=base*0.5,dn=base*0.5;if(auth===1){dn=base*0.15;up=base*0.85;}
      if(!measOK&&meas===1){base*=0.7;up*=0.7;dn*=0.7;}
      const n=[timeOK,infoOK,authOK,measOK].filter(Boolean).length;
      return{t:t.toFixed(1),ovr:(up+dn).toFixed(1),up:up.toFixed(1),dn:dn.toFixed(1),n,real:n===4};
    }
    function render(){
      const s=sim();
      el.innerHTML=`<p class="hint">${lab.intro}</p>
      <div class="ctl"><h4>${lab.quota}: <b>${quota}</b> <span class="hint">(${lab.time}: ${s.t} ${lab.min})</span></h4><input type="range" class="slider" id="q" min="2" max="40" step="1" value="${quota}"></div>
      <div class="ctl"><h4>${lab.info}</h4><div class="chips">${INFO.map((o,i)=>`<button type="button" class="chip ${info===i?'sel':''}" data-c="info" data-i="${i}">${o}</button>`).join('')}</div></div>
      <div class="ctl"><h4>${lab.auth}</h4><div class="chips">${AUTH.map((o,i)=>`<button type="button" class="chip ${auth===i?'sel':''}" data-c="auth" data-i="${i}">${o}</button>`).join('')}</div></div>
      <div class="ctl"><h4>${lab.meas}</h4><div class="chips">${MEAS.map((o,i)=>`<button type="button" class="chip ${meas===i?'sel':''}" data-c="meas" data-i="${i}">${o}</button>`).join('')}</div></div>
      <div class="dash"><div>${lab.ovr}<b>${s.ovr}%</b></div><div>${lab.cond}<b>${s.n} / 4</b></div><div>${lab.ovrUp}<b>${s.up}%</b></div><div>${lab.ovrDn}<b>${s.dn}%</b></div></div>
      <div class="stamp ${s.real?'ok':'bad'}">${s.real?lab.real:lab.rubber}</div>
      <div class="row"><button type="button" class="btn" id="adopt">${lab.adopt}</button></div>`;
      el.querySelector('#q').addEventListener('input',e=>{quota=+e.target.value;render();});
      el.querySelectorAll('[data-c]').forEach(b=>b.addEventListener('click',()=>{const v=+b.dataset.i;if(b.dataset.c==='info')info=v;else if(b.dataset.c==='auth')auth=v;else meas=v;render();}));
      el.querySelector('#adopt').addEventListener('click',()=>{const r=sim();ctx.done(r.n,4);});
    }
    if(ctx.state.done){el.innerHTML=`<p class="fb ok">${ar?'اعتُمد التصميم':'Design adopted'} — ${ctx.state.score} / ${ctx.state.max}</p>`;return;}
    render();
  });
})();

Course.init({
  slug:'committee',
  lectures:{ar:'محاور الأخلاقيات والخصوصية والرقابة البشرية',en:'Ethics, privacy and human-oversight topics'},
  title:{ar:'لجنة الأخلاقيات',en:'The Ethics Committee'},
  sub:{ar:'محاكاة في ثلاثة فصول: أنت عضو لجنة تراجع نظام ائتمان آلي قبل إطلاقه. الفصل 1: تدقيق التحيز والإنصاف بالأرقام. الفصل 2: البيانات التي تُلصق والهجمات التي تُشن. الفصل 3: تصميم رقابة بشرية حقيقية لا ختمًا مطاطيًا.',en:'A simulation in three acts: you sit on a committee reviewing an automated credit system before launch. Act 1: auditing bias and fairness with numbers. Act 2: the data that gets pasted and the attacks that get launched. Act 3: designing meaningful human oversight, not a rubber stamp.'},
  how:{ar:['الفصل 1 يحوي جدول نتائج حقيقي الشكل: اقرأه صفًا صفًا.','الفصل 3 محاكٍ: كل شرط من الشروط الأربعة يغيّر نسبة التجاوز.','كل فصل يُحتسب نقاطًا والتحدي يفتح الفصل التالي.'],
       en:['Act 1 contains a realistic results table: read it row by row.','Act 3 is a simulator: each of the four conditions changes the override rate.','Every act counts as points and the challenge unlocks the next.']},
  sections:[
  { id:'s1', n:'1', t:{ar:'الفصل 1: تدقيق الإنصاف بالأرقام',en:'Act 1: auditing fairness with numbers'}, y:{ar:'التحيز، الوكلاء، تعريفات الإنصاف، التفسير، المسؤولية',en:'Bias, proxies, fairness definitions, explainability, accountability'},
    story:{ar:['الاقتصادي يهتم بالأخلاق لأن الخطأ الأخلاقي في نظام آلي <b>خطأ اقتصادي مضاعف</b>: يتكرر آلاف المرات بالثقة نفسها، ويكلّف غرامات وسمعة وأرباحًا ضائعة. «الخوارزمية رياضيات فهي محايدة» وهم: تتعلم من بيانات الماضي بما فيها من تمييز وتضخّمه.',
      '<b>التحيز</b> يدخل من خمس محطات: <b>البيانات التاريخية</b> (ماضٍ غير عادل)، <b>التمثيل الناقص</b> (فئة قليلة في العينة)، <b>القياس والوكلاء</b> (حذفت عمود الجنس؟ الاسم والبلدية ونوع النشاط <b>متغيرات وكيلة</b> تعيده)، <b>صياغة الهدف</b> (تعظيم الربح القصير)، و<b>حلقة التغذية الراجعة</b> (قرارات اليوم تصنع بيانات الغد: من رُفض لا يترك سجل سداد).',
      '<b>الإنصاف</b> ليس تعريفًا واحدًا: <b>التكافؤ الديموغرافي</b> (نسبة قبول واحدة)، <b>تساوي الأخطاء</b> (نسبة خطأ واحدة لكل فئة)، <b>المعايرة</b> (الدرجة 70 تعني احتمال السداد نفسه للجميع). رياضيًا لا تتحقق معًا في الغالب، فاختيار المعيار <b>قرار إداري موثق</b>. والدقة الإجمالية 89% تخفي فروقًا كبيرة بين الفئات: اسأل عن الخطأ حسب الفئة. ثم <b>القابلية للتفسير</b>: الزبونة التي حصلت على 41 يحق لها معرفة أهم الأسباب و<b>حق الطعن</b> أمام إنسان؛ و<b>المساءلة</b>: المؤسسة الناشرة مسؤولة أمام الزبون والمنظّم، والعقد مع المورّد لا ينقل المسؤولية القانونية.'],
      en:['An economist cares about ethics because an ethical error in an automated system is a <b>compounded economic error</b>: it repeats thousands of times with the same confidence, and costs fines, reputation and lost profit. "The algorithm is mathematics, so it is neutral" is an illusion: it learns from past data, discrimination included, and amplifies it.',
      '<b>Bias</b> enters at five stations: <b>historical data</b> (an unfair past), <b>representation</b> (a group too small in the sample), <b>measurement and proxies</b> (dropped the gender column? first name, municipality and activity type are <b>proxy variables</b> that bring it back), <b>objective framing</b> (maximising short-term profit), and the <b>feedback loop</b> (today\'s decisions make tomorrow\'s data: the rejected leave no repayment record).',
      '<b>Fairness</b> is not one definition: <b>demographic parity</b> (one acceptance rate), <b>equalized odds</b> (one error rate per group), <b>calibration</b> (a score of 70 means the same repayment probability for everyone). Mathematically they mostly cannot hold together, so choosing the criterion is a <b>documented managerial decision</b>. And 89% overall accuracy hides large gaps between groups: ask for error by group. Then <b>explainability</b>: the customer who scored 41 is entitled to the main reasons and a <b>right to contest</b> before a human; and <b>accountability</b>: the deploying organisation answers to the customer and the regulator, and the vendor contract does not transfer legal liability.']},
    lesson:{ar:'«حذفنا عمود الجنس فانتهت المشكلة» أشهر خطأ في اللجان: الوكلاء يعيدونه، والفحص الوحيد هو الخطأ حسب الفئة.',en:'"We dropped the gender column, problem solved" is the committee\'s most common mistake: proxies bring it back, and the only check is error by group.'},
    terms:[
      {en:'Bias',fr:'Biais',ar:'التحيز',s:{ar:'انحراف منهجي في أخطاء النموذج يضر فئة أكثر من أخرى.',en:'A systematic skew in the model\'s errors that harms one group more than another.'},c:{ar:'ليس «رأيًا» للآلة بل أثر البيانات والتصميم.',en:'Not the machine\'s "opinion" but the effect of data and design.'}},
      {en:'Proxy variable',fr:'Variable proxy',ar:'المتغير الوكيل',s:{ar:'متغير بريء الظاهر (الاسم، البلدية، نوع النشاط) يحمل معلومة صفة محمية.',en:'An innocent-looking variable (name, municipality, activity type) that carries a protected attribute.'},c:{ar:'حذف العمود المحمي لا يحذف وكلاءه.',en:'Dropping the protected column does not drop its proxies.'}},
      {en:'Feedback loop',fr:'Boucle de rétroaction',ar:'حلقة التغذية الراجعة',s:{ar:'قرارات النظام اليوم تصنع بيانات تدريبه غدًا؛ من رُفض لا يترك سجلًا يثبت جدارته.',en:'The system\'s decisions today create its training data tomorrow; the rejected leave no record proving their merit.'},c:{ar:'التحيز يتعزز ذاتيًا بلا تدخل.',en:'Bias self-reinforces without intervention.'}},
      {en:'Demographic parity',fr:'Parité démographique',ar:'التكافؤ الديموغرافي',s:{ar:'نسبة قبول واحدة لكل الفئات.',en:'One acceptance rate across groups.'},c:{ar:'قد يتعارض مع المعايرة.',en:'May conflict with calibration.'}},
      {en:'Equalized odds',fr:'Égalité des erreurs',ar:'تساوي الأخطاء',s:{ar:'نسب الإيجابي الكاذب والسلبي الكاذب واحدة لكل فئة.',en:'Equal false-positive and false-negative rates per group.'},c:{ar:'المعيار الأنسب غالبًا للقرارات الحساسة.',en:'Often the most apt criterion for sensitive decisions.'}},
      {en:'Calibration',fr:'Calibration',ar:'المعايرة',s:{ar:'الدرجة نفسها تعني الاحتمال نفسه للجميع (70 = 70% سداد لكل فئة).',en:'The same score means the same probability for everyone (70 = 70% repayment in every group).'},c:{ar:'قد يتحقق مع تحيز كبير في الأخطاء.',en:'Can hold alongside large error gaps.'}},
      {en:'Explainability (XAI)',fr:'Explicabilité',ar:'القابلية للتفسير',s:{ar:'سبب مفهوم لكل قرار؛ في الائتمان والتوظيف يُفضَّل نموذج قابل للتفسير من الأصل.',en:'An understandable reason for every decision; in credit and hiring an inherently interpretable model is preferred.'},c:{ar:'أدوات التفسير اللاحق تقريبات.',en:'Post-hoc explanation tools are approximations.'}},
      {en:'Accountability',fr:'Redevabilité',ar:'المساءلة',s:{ar:'جهة محددة تجيب عن القرار أمام الزبون والمنظّم: المؤسسة الناشرة.',en:'A named party answering for the decision to the customer and regulator: the deploying organisation.'},c:{ar:'العقد مع المورّد لا ينقلها.',en:'The vendor contract does not transfer it.'}}],
    activity:{id:'audit',title:{ar:'دقّق نموذج الائتمان',en:'Audit the credit model'},
      vars:[
        {id:'name',t:{ar:'الاسم الأول',en:'First name'},proxy:true,why:{ar:'يكشف الجنس والأصل غالبًا.',en:'Usually reveals gender and origin.'}},
        {id:'muni',t:{ar:'البلدية',en:'Municipality'},proxy:true,why:{ar:'تحمل الأصل والمستوى الاجتماعي.',en:'Carries origin and social status.'}},
        {id:'act',t:{ar:'نوع النشاط (منزلي/محل)',en:'Activity type (home-based/shop)'},proxy:true,why:{ar:'النشاط المنزلي مرتبط بالنساء في البيانات.',en:'Home-based activity correlates with women in the data.'}},
        {id:'phone',t:{ar:'ماركة الهاتف',en:'Phone brand'},proxy:true,why:{ar:'وكيل للدخل والسن لا علاقة له بالجدارة.',en:'A proxy for income and age unrelated to creditworthiness.'}},
        {id:'inc',t:{ar:'الدخل الشهري الموثق',en:'Documented monthly income'},proxy:false},
        {id:'hist',t:{ar:'تاريخ السداد السابق',en:'Past repayment history'},proxy:false},
        {id:'debt',t:{ar:'نسبة الدين إلى الدخل',en:'Debt-to-income ratio'},proxy:false},
        {id:'dur',t:{ar:'مدة النشاط بالسنوات',en:'Years in business'},proxy:false}],
      groups:[{ar:'المتقدمون (1000)',en:'Men (1,000)'},{ar:'المتقدمات (1000)',en:'Women (1,000)'}],
      rows:[
        {t:{ar:'نسبة القبول',en:'Acceptance rate'},v:['60%','45%']},
        {t:{ar:'الجديرون بالسداد فعلًا',en:'Actually creditworthy'},v:['700','700']},
        {t:{ar:'جديرون رُفضوا (سلبي كاذب)',en:'Creditworthy rejected (false negative)'},v:['140 (20%)','280 (40%)']},
        {t:{ar:'غير جديرين قُبلوا (إيجابي كاذب)',en:'Non-creditworthy accepted (false positive)'},v:['40 (13%)','30 (10%)']},
        {t:{ar:'نسبة السداد بين المقبولين',en:'Repayment rate among the accepted'},v:['93%','93%']}],
      qs:[
        {q:{ar:'هل يتحقق التكافؤ الديموغرافي؟',en:'Does demographic parity hold?'},o:[{ar:'نعم',en:'Yes'},{ar:'لا: 60% مقابل 45%',en:'No: 60% vs 45%'}],a:1,w:{ar:'نسبتا القبول مختلفتان.',en:'The acceptance rates differ.'}},
        {q:{ar:'من يتضرر أكثر من الرفض الخاطئ رغم الجدارة؟',en:'Who suffers more wrongful rejection despite merit?'},o:[{ar:'المتقدمون',en:'Men'},{ar:'المتقدمات: 40% مقابل 20%',en:'Women: 40% vs 20%'},{ar:'لا فرق',en:'No difference'}],a:1,w:{ar:'تساوي الأخطاء منتهك: ضعف السلبي الكاذب.',en:'Equalized odds violated: double the false negatives.'}},
        {q:{ar:'هل النموذج معاير بين الفئتين؟',en:'Is the model calibrated across the two groups?'},o:[{ar:'نعم: 93% سداد للفئتين',en:'Yes: 93% repayment in both'},{ar:'لا',en:'No'}],a:0,w:{ar:'المعايرة متحققة رغم انتهاك المعيارين الآخرين: لا تتحقق التعريفات معًا، والاختيار قرار إداري موثق.',en:'Calibration holds while the other two criteria fail: the definitions cannot all hold, and the choice is a documented managerial decision.'}},
        {q:{ar:'قال المورّد: «الدقة الإجمالية 89%، كفى». رد اللجنة؟',en:'The vendor said: "Overall accuracy is 89%, enough." The committee\'s reply?'},o:[{ar:'نقبل: 89% نسبة ممتازة',en:'Accept: 89% is excellent'},{ar:'نرفض: الدقة الإجمالية تخفي ضعف الخطأ لدى فئة كاملة',en:'Reject: overall accuracy hides double the error for a whole group'}],a:1,w:{ar:'اسأل دائمًا عن الخطأ حسب الفئة.',en:'Always ask for error by group.'}}]},
    qs:[
      {k:'mcq',q:{ar:'حذف عمود الجنس من البيانات:',en:'Dropping the gender column from the data:'},o:{ar:['يضمن الإنصاف','لا يمنع التحيز لأن الوكلاء يعيدونه','يمنعه قانونًا','يحسّن الدقة'],en:['Guarantees fairness','Does not prevent bias because proxies bring it back','Prevents it by law','Improves accuracy']},a:1,w:{ar:'الاسم والبلدية ونوع النشاط وكلاء.',en:'Name, municipality and activity type are proxies.'}},
      {k:'tf',q:{ar:'يمكن تحقيق التكافؤ الديموغرافي وتساوي الأخطاء والمعايرة معًا دائمًا.',en:'Demographic parity, equalized odds and calibration can always be achieved together.'},a:false,w:{ar:'متعارضة في الغالب؛ الاختيار قرار إداري موثق.',en:'Mostly incompatible; the choice is a documented managerial decision.'}},
      {k:'mcq',q:{ar:'من يُسأل أمام الزبون حين يخطئ نموذج اشتراه البنك من مورّد؟',en:'Who answers to the customer when a model the bank bought from a vendor errs?'},o:{ar:['المورّد وحده','المبرمج','البنك الناشر للنظام','لا أحد'],en:['The vendor alone','The programmer','The bank that deployed it','Nobody']},a:2,w:{ar:'العقد لا ينقل المسؤولية القانونية.',en:'The contract does not transfer legal liability.'}}]},

  { id:'s2', n:'2', t:{ar:'الفصل 2: البيانات والهجمات',en:'Act 2: data and attacks'}, y:{ar:'الخصوصية والأمان في عصر الذكاء الاصطناعي',en:'Privacy and security in the AI era'},
    story:{ar:['<b>المعطيات الشخصية</b> كل ما يعرّف شخصًا مباشرة أو بشكل غير مباشر، و<b>الحساسة</b> منها (صحة، دين، أصل، بيومترية) تحظى بحماية مشددة. «حذفت الأسماء فالبيانات مجهولة» خطأ: الهاتف والعنوان ومزيج السن والمهنة والبلدية تعرّف الشخص؛ الحذف <b>ترميز (Pseudonymisation)</b> لا <b>إخفاء (Anonymisation)</b>، و<b>إعادة التعريف</b> ممكنة. المجهول فعلًا هو المجمّع.',
      'ما تلصقه في أداة عامة يسافر إلى خادم في بلد آخر (<b>موقع التخزين</b>)، وقد يُحفظ (<b>الاحتفاظ</b>) ويدرَّب عليه ويقرأه بشر. الفرق بين الحساب المجاني والعقد المؤسسي فرق عقد. القاعدة: قوالب بلا أسماء، ولا بيانات زبائن في أداة غير معتمدة. والقانون الجزائري <b>18-07</b> كما <b>GDPR</b>: أساس قانوني، غرض محدد، تقليل البيانات، أمن، حقوق الأشخاص؛ و<b>المسؤول عن المعالجة</b> هو المؤسسة وإن كان المزوّد الأجنبي <b>معالجًا من الباطن</b>.',
      'أربع هجمات لم تكن موجودة قبل الذكاء الاصطناعي: <b>حقن الأوامر</b> (نص من طرف ثالث يخدع النموذج)، <b>تسميم البيانات</b> (أمثلة خبيثة في التدريب)، <b>المثال العدائي</b> (تعديل خفي يقلب القرار)، <b>استخراج بيانات التدريب</b> (النموذج يكرر ما حفظه). يضاف إليها الاحتيال المولّد: <b>التصيّد الموجَّه</b> بلغة سليمة وتفاصيل حقيقية، فالركاكة لم تعد علامة. والمنع لا يحل شيئًا: يُنتج <b>ذكاءً اصطناعيًا في الظل</b>؛ الحل ميثاق وأدوات معتمدة و<b>اختبار اختراق أخلاقي</b> دوري.'],
      en:['<b>Personal data</b> is anything that identifies a person directly or indirectly, and the <b>sensitive</b> kind (health, religion, origin, biometrics) gets stricter protection. "I removed the names, so the data is anonymous" is wrong: phone, address, and the mix of age, occupation and municipality identify a person; removal is <b>pseudonymisation</b>, not <b>anonymisation</b>, and <b>re-identification</b> is possible. The truly anonymous is the aggregated.',
      'What you paste into a public tool travels to a server in another country (<b>data residency</b>), may be kept (<b>retention</b>), trained on and read by humans. The difference between a free account and an enterprise contract is a contract. The rule: templates without names, and no customer data in an unapproved tool. Algeria\'s law <b>18-07</b>, like <b>GDPR</b>: legal basis, specific purpose, data minimisation, security, individuals\' rights; and the <b>data controller</b> is the organisation even when the foreign provider is a <b>processor</b>.',
      'Four attacks that did not exist before AI: <b>prompt injection</b> (third-party text that fools the model), <b>data poisoning</b> (malicious examples in training), <b>adversarial examples</b> (an imperceptible change that flips the decision), <b>training data extraction</b> (the model repeats what it memorised). Add generated fraud: <b>spear phishing</b> in flawless language with real details, so clumsiness is no longer a tell. Banning solves nothing: it produces <b>shadow AI</b>; the answer is a charter, approved tools and periodic <b>red teaming</b>.']},
    lesson:{ar:'الأداة المجانية المشهورة ليست آمنة لأنها مشهورة؛ الأمان في العقد المؤسسي، والمسؤولية القانونية تبقى على المؤسسة.',en:'A famous free tool is not safe because it is famous; safety lies in the enterprise contract, and legal responsibility stays with the organisation.'},
    terms:[
      {en:'Personal / Sensitive data',fr:'Données personnelles / sensibles',ar:'المعطيات الشخصية / الحساسة',s:{ar:'كل ما يعرّف شخصًا؛ والحساسة: صحة، دين، أصل، بيومترية، بحماية مشددة.',en:'Anything identifying a person; sensitive: health, religion, origin, biometrics, with stricter protection.'},c:{ar:'القانون 18-07 ينظمها في الجزائر.',en:'Law 18-07 governs it in Algeria.'}},
      {en:'Anonymisation / Pseudonymisation',fr:'Anonymisation / Pseudonymisation',ar:'إخفاء الهوية / الترميز',s:{ar:'الإخفاء: تعرّف مستحيل بشكل معقول. الترميز: اسم ← رقم مع مفتاح، ويبقى شخصيًا.',en:'Anonymisation: identification reasonably impossible. Pseudonymisation: name → code with a key; still personal.'},c:{ar:'حذف الاسم ترميز لا إخفاء.',en:'Removing the name is pseudonymisation, not anonymisation.'}},
      {en:'Data residency / Retention',fr:'Localisation / Conservation',ar:'موقع التخزين / الاحتفاظ',s:{ar:'في أي بلد تقع الخوادم، وكم تُحفظ البيانات؛ يحددهما العقد.',en:'Which country the servers are in, and how long data is kept; set by the contract.'},c:{ar:'اسأل قبل أي أداة.',en:'Ask before any tool.'}},
      {en:'Data controller / processor',fr:'Responsable du traitement / Sous-traitant',ar:'المسؤول عن المعالجة / المعالج من الباطن',s:{ar:'المسؤول يقرر لماذا وكيف (المؤسسة)؛ المعالج ينفذ لحسابه (المزوّد).',en:'The controller decides why and how (the organisation); the processor executes on its behalf (the provider).'},c:{ar:'المسؤولية القانونية على المسؤول.',en:'Legal liability sits with the controller.'}},
      {en:'Data poisoning',fr:'Empoisonnement',ar:'تسميم البيانات',s:{ar:'دسّ أمثلة خبيثة في بيانات التدريب لتوجيه سلوك النموذج لاحقًا.',en:'Planting malicious examples in training data to steer the model\'s later behaviour.'},c:{ar:'يستهدف مرحلة التدريب لا الاستعمال.',en:'Targets training, not use.'}},
      {en:'Adversarial example',fr:'Exemple adversarial',ar:'المثال العدائي',s:{ar:'تعديل خفي لا يراه الإنسان (بكسلات، حروف) يقلب قرار النموذج.',en:'An imperceptible change (pixels, characters) that flips the model\'s decision.'},c:{ar:'يستهدف مرحلة الاستعمال.',en:'Targets use.'}},
      {en:'Spear phishing',fr:'Hameçonnage ciblé',ar:'التصيّد الموجَّه',s:{ar:'احتيال مخصص بمعلومات حقيقية عن الضحية بلغة سليمة مولّدة.',en:'Targeted fraud with real information about the victim in flawless generated language.'},c:{ar:'الأصالة تُثبت بالقناة والإجراء لا بالأسلوب.',en:'Authenticity is proven by channel and procedure, not style.'}},
      {en:'Shadow AI',fr:'IA fantôme',ar:'الذكاء الاصطناعي في الظل',s:{ar:'أدوات غير معتمدة يستعملها الموظفون سرًا حين تُمنع الأدوات.',en:'Unapproved tools employees use secretly when tools are banned.'},c:{ar:'الحل ميثاق وأدوات معتمدة لا منع.',en:'The answer is a charter and approved tools, not a ban.'}}],

  { id:'s3', n:'3', t:{ar:'الفصل 3: رقابة حقيقية لا ختم مطاطي',en:'Act 3: real oversight, not a rubber stamp'}, y:{ar:'الرقابة البشرية وحدود الأتمتة',en:'Human oversight and the limits of automation'},
    story:{ar:['ثلاثة مواقع للإنسان من القرار الآلي: <b>في الحلقة</b> (يقرر كل حالة: قروض كبيرة، توظيف، عقوبات)، <b>على الحلقة</b> (يراقب ويتدخل: كشف الاحتيال الآني، إدارة المخزون)، <b>خارج الحلقة</b> (يصمم ويدقق لاحقًا: التوصية، الترجمة الأولية). الاختيار حسب <b>تكلفة الخطأ</b> و<b>قابلية عكسه</b> لا حسب قدرة الآلة؛ «الإنسان في الحلقة دائمًا أفضل» خطأ: في الاحتيال الآني يكون أبطأ وأسوأ.',
      'لماذا تفشل الرقابة في الواقع؟ <b>انحياز الأتمتة</b>: الاقتراح الآلي يصير الوضع الافتراضي، الحصص ترتفع، ويتحول التوقيع إلى <b>ختم مطاطي</b>. نسبة مطابقة 98% ليست دليل جودة بل قد تكون دليل انحياز؛ الكاشف هو <b>نسبة التجاوز</b> في الاتجاهين وأسبابها (<b>التجاوز غير المتماثل</b>: مخالفة نحو القبول فقط علامة خطر). و<b>فقدان المهارة</b> تكلفة خفية: من لا يستطيع العمل دون الأداة لا يستطيع مراقبتها ولا الاستمرار عند تعطلها (<b>خطة الاستمرارية</b>).',
      '<b>التحكم البشري الفعلي</b> أربعة شروط: <b>فهم</b> (ما الذي يقترحه النموذج ولماذا)، <b>وقت ومعلومة</b> (حصة معقولة والأسباب لا الدرجة فقط)، <b>صلاحية</b> (يخالف دون عقوبة ويوثق)، <b>مساءلة وقياس</b> (نسبة التجاوز تُقاس في الاتجاهين). غياب واحد منها يفرغ الرقابة من معناها مهما قال التنظيم الداخلي، والمادة 14 من القانون الأوروبي تشترط إشرافًا «فعّالًا». وهذه مسألة تنظيم عمل يصممها المسيّر لا المهندس. والمقياس كله خمسة أسئلة لمشروعكم: ما هو؟ كيف نستعمله؟ أين القيمة؟ ما المخاطر؟ من يقرر ومن يُسأل؟'],
      en:['Three positions for the human relative to an automated decision: <b>in the loop</b> (decides each case: large loans, hiring, sanctions), <b>on the loop</b> (monitors and intervenes: real-time fraud detection, inventory), <b>out of the loop</b> (designs and audits later: recommendation, first-pass translation). The choice follows the <b>cost of error</b> and its <b>reversibility</b>, not the machine\'s ability; "a human in the loop is always better" is wrong: in real-time fraud the human is slower and worse.',
      'Why does oversight fail in practice? <b>Automation bias</b>: the automated suggestion becomes the default, quotas rise, and the signature turns into a <b>rubber stamp</b>. A 98% agreement rate is not proof of quality but possibly of bias; the detector is the <b>override rate</b> in both directions and its reasons (<b>asymmetric override</b>: deviating only towards approval is a warning sign). And <b>deskilling</b> is a hidden cost: whoever cannot work without the tool cannot supervise it nor carry on when it fails (<b>business continuity plan</b>).',
      '<b>Meaningful human control</b> has four conditions: <b>understanding</b> (what the model suggests and why), <b>time and information</b> (a reasonable quota and the reasons, not just a score), <b>authority</b> (may deviate without penalty and documents it), <b>accountability and measurement</b> (the override rate is measured both ways). Missing any one empties oversight of meaning whatever the internal rulebook says, and Article 14 of the EU AI Act requires "effective" oversight. This is work design, done by the manager, not the engineer. And the whole course is five questions for your project: what is it? how do we use it? where is the value? what are the risks? who decides and who answers?']},
    lesson:{ar:'وجود موظف يوقّع لا يعني إشرافًا بشريًا: بلا فهم ووقت وصلاحية وقياس، التوقيع ختم مطاطي.',en:'An employee who signs is not human oversight: without understanding, time, authority and measurement, the signature is a rubber stamp.'},
    terms:[
      {en:'Human in / on / out of the loop',fr:'Humain dans / sur / hors de la boucle',ar:'الإنسان في / على / خارج الحلقة',s:{ar:'يقرر كل حالة / يراقب ويتدخل / يصمم ويدقق لاحقًا؛ الاختيار حسب تكلفة الخطأ وقابلية عكسه.',en:'Decides each case / monitors and intervenes / designs and audits later; chosen by the cost of error and its reversibility.'},c:{ar:'خارج الحلقة ≠ بلا مسؤولية.',en:'Out of the loop ≠ no responsibility.'}},
