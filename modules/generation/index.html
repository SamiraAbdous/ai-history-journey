<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>مختبر التوليد</title>
<meta name="description" content="مختبر تفاعلي: اصطياد الهلوسة في نص مولّد، بناء أمر صورة من عناصره الستة، مواجهة احتيال بالتزييف العميق، ورسم الخط الأكاديمي والقانوني — من إعداد د. سميرة عبدوس.">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Changa:wght@600;700;800&family=Tajawal:wght@400;500;700&display=swap">
<link rel="stylesheet" href="../../assets/app.css">
<style>:root{--accent:#A8336B;--accent-soft:#F6DDE8}@media (prefers-color-scheme: dark){:root:not([data-theme="light"]){--accent:#E58BB4;--accent-soft:#3F1F2F}}
.slot{margin:8px 0;padding:8px 10px;border:1px solid var(--line);border-radius:10px;background:var(--bg)}
.slot h4{margin:0 0 6px;font-family:var(--display);font-size:14px}
.preview{white-space:pre-wrap;font-size:13.5px;background:var(--paper);border:1px dashed var(--accent);border-radius:10px;padding:10px;margin-top:8px;line-height:1.6;direction:ltr;text-align:left}
.frame{display:flex;justify-content:center;margin:10px 0}
.frame svg{max-width:100%;border-radius:10px;border:1px solid var(--line);background:#ddd}
.seedrow{display:flex;gap:8px;align-items:center;flex-wrap:wrap;margin-top:8px;font-size:13px}
</style>
</head>
<body>
<script src="../../assets/engine.js"></script>
<script src="../../assets/widgets.js"></script>
<script>
(function(){
  Course.widget('imageprompt',function(el,data,ctx){
    const L=ctx.L,ar=ctx.lang==='ar';let pick={},neg=false,seedLock=false,seed=null,gens=0,sawDiff=false,sawSame=false,lastSeed=null;
    const lab=ar?{intro:'اختر العناصر الستة، ثم ولّد. جرّب التوليد مرتين بلا بذرة ثابتة، ثم ثبّت البذرة وأعد التوليد.',neg:'أمر سلبي: بلا نص مكتوب، بلا أيدٍ مشوّهة، بلا شعارات',lock:'تثبيت البذرة (Seed)',gen:'ولّد الصورة (محاكاة)',regen:'أعد التوليد',seed:'البذرة',prompt:'الأمر كما سيُرسل:',check:'افحص قبل النشر: الأيدي، النصوص داخل الصورة، الانعكاسات، الشعارات.',finish:'اعتمد الصورة',diff:'لاحظ: الوصف نفسه أعطى صورة مختلفة لأن الضوضاء الأولى عشوائية.',same:'لاحظ: مع بذرة ثابتة تتكرر الصورة نفسها.'}
                 :{intro:'Choose the six elements, then generate. Generate twice without a fixed seed, then lock the seed and regenerate.',neg:'Negative prompt: no written text, no deformed hands, no logos',lock:'Lock the seed',gen:'Generate the image (simulated)',regen:'Regenerate',seed:'Seed',prompt:'The prompt as it will be sent:',check:'Inspect before publishing: hands, in-image text, reflections, logos.',finish:'Adopt the image',diff:'Notice: the same description gave a different image because the initial noise is random.',same:'Notice: with a locked seed the same image repeats.'};
    const all=()=>data.slots.every(s=>pick[s.id]!==undefined);
    function rnd(s){let x=Math.sin(s*9301+49297)*233280;return x-Math.floor(x);}
    function scene(){
      const g=id=>data.slots.find(s=>s.id===id).opts[pick[id]];
      const sub=g('subject'),set=g('setting'),sty=g('style'),lig=g('lighting'),fr=g('framing'),asp=g('aspect');
      const [w,h]=asp.wh;const r1=rnd(seed),r2=rnd(seed+1),r3=rnd(seed+2);
      const sc=fr.scale*(0.85+0.3*r1);const cx=w/2+(r2-0.5)*w*0.25,cy=h*0.6+(r3-0.5)*h*0.15;
      const blur=sty.id==='water'?'filter="url(#wc)"':'';const flat=sty.id==='flat';
      const stops=lig.stops;
      return `<svg viewBox="0 0 ${w} ${h}" width="${w>h?300:200}" xmlns="http://www.w3.org/2000/svg"><defs><linearGradient id="bg" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="${set.c[0]}"/><stop offset="1" stop-color="${set.c[1]}"/></linearGradient><radialGradient id="lg" cx="${lig.x}" cy="0.1" r="0.9"><stop offset="0" stop-color="${stops[0]}" stop-opacity=".75"/><stop offset="1" stop-color="${stops[1]}" stop-opacity="0"/></radialGradient><filter id="wc"><feTurbulence baseFrequency=".02" numOctaves="2" seed="${seed%50}"/><feDisplacementMap in="SourceGraphic" scale="12"/><feGaussianBlur stdDeviation="1.2"/></filter></defs>
      <rect width="${w}" height="${h}" fill="url(#bg)"/>${set.decor.map(d=>`<rect x="${d[0]*w}" y="${d[1]*h}" width="${d[2]*w}" height="${d[3]*h}" fill="${d[4]}" opacity="${flat?1:.6}" ${blur}/>`).join('')}
      <rect width="${w}" height="${h}" fill="url(#lg)"/>
      <g ${blur}><text x="${cx}" y="${cy}" font-size="${Math.round(Math.min(w,h)*0.32*sc)}" text-anchor="middle" dominant-baseline="middle" ${flat?'style="filter:saturate(1.6)"':''}>${sub.e}</text></g>
      ${!flat?`<ellipse cx="${cx}" cy="${cy+Math.min(w,h)*0.18*sc}" rx="${Math.min(w,h)*0.22*sc}" ry="${Math.min(w,h)*0.04*sc}" fill="#000" opacity=".18"/>`:''}
      </svg>`;
    }
    function render(){
      const ok=all();
      el.innerHTML=`<p class="hint">${lab.intro}</p>${data.slots.map(s=>`<div class="slot"><h4>${L(s.t)} <span class="hint">(${s.en})</span></h4><div class="chips">${s.opts.map((o,i)=>`<button type="button" class="chip ${pick[s.id]===i?'sel':''}" data-slot="${s.id}" data-i="${i}">${L(o.t)}</button>`).join('')}</div></div>`).join('')}
      <div class="chips"><button type="button" class="chip ${neg?'sel':''}" id="negb">${lab.neg}</button><button type="button" class="chip ${seedLock?'sel':''}" id="lockb">${lab.lock}</button></div>
      ${ok?`<p class="hint">${lab.prompt}</p><div class="preview">${data.slots.map(s=>s.opts[pick[s.id]].p).join(', ')}${neg?' --no text, deformed hands, logos':''}${seedLock&&seed!==null?' --seed '+seed:''}</div>`:''}
      ${gens>0?`<div class="frame">${scene()}</div><div class="seedrow"><span>${lab.seed}: <b>${seed}</b></span>${sawDiff?`<span class="fb ok">${lab.diff}</span>`:''}${sawSame?`<span class="fb ok">${lab.same}</span>`:''}</div><p class="hint">${lab.check}</p>`:''}
      <div class="row"><button type="button" class="btn" id="gen" ${ok?'':'disabled'}>${gens?lab.regen:lab.gen}</button>${gens>0?`<button type="button" class="btn ghost" id="fin">${lab.finish}</button>`:''}</div>`;
      el.querySelectorAll('[data-slot]').forEach(b=>b.addEventListener('click',()=>{pick[b.dataset.slot]=+b.dataset.i;render();}));
      el.querySelector('#negb').addEventListener('click',()=>{neg=!neg;render();});
      el.querySelector('#lockb').addEventListener('click',()=>{seedLock=!seedLock;render();});
      el.querySelector('#gen').addEventListener('click',()=>{if(seedLock&&seed!==null){if(gens>0)sawSame=true;}else{const ns=Math.floor(Math.random()*9000)+1000;if(gens>0&&ns!==seed)sawDiff=true;seed=ns;}gens++;render();});
      const f=el.querySelector('#fin');if(f)f.addEventListener('click',()=>ctx.done((gens>0?1:0)+(neg?1:0)+(sawSame?1:0),3));
    }
    if(ctx.state.done){el.innerHTML=`<p class="fb ok">${ar?'انتهى النشاط':'Activity finished'} — ${ctx.state.score} / ${ctx.state.max}</p>`;return;}
    render();
  });
})();

Course.init({
  slug:'generation',
  lectures:{ar:'محورا توليد النصوص والصور والصوت',en:'Text, image and audio generation topics'},
  title:{ar:'مختبر التوليد',en:'The Generation Lab'},
  sub:{ar:'مختبر في أربع تجارب: تصطاد الهلوسة والحشو في نص مولّد، تبني أمر صورة من عناصره الستة وترى أثر البذرة، تواجه محاولة احتيال بالتزييف العميق، ثم ترسم الخط بين المشروع وغير المشروع أكاديميًا وقانونيًا.',en:'A lab in four experiments: hunt hallucination and filler in a generated text, build an image prompt from its six elements and see what the seed does, face a deepfake fraud attempt, then draw the line between legitimate and illegitimate use, academically and legally.'},
  how:{ar:['التجربة 2 تولّد «صورة» رمزية بسيطة؛ المقصود فهم العناصر والعشوائية، لا جودة الرسم.','التجربة 3 لعبة قرار: كل اختيار يحرّك ثلاثة عدادات.','كل تجربة تُحتسب نقاطًا والتحدي يفتح التالية.'],
       en:['Experiment 2 generates a simple symbolic "image"; the point is understanding the elements and randomness, not drawing quality.','Experiment 3 is a decision game: every choice moves three meters.','Every experiment counts as points and the challenge unlocks the next.']},
  sections:[
  { id:'s1', n:'1', t:{ar:'اصطياد الهلوسة في نص مولّد',en:'Hunting hallucination in a generated text'}, y:{ar:'توليد النصوص: أين يتفوق وأين يخطر',en:'Text generation: where it excels and where it is risky'},
    story:{ar:['النموذج يتفوق في <b>شكل النص</b>: الصياغة، البنية، النبرة، السجل اللغوي. ويخطر في <b>المضمون الملزم</b>: الوقائع، الأرقام، الوعود، تقييم الأشخاص. القاعدة: كلما اقترب النص من إلزام المؤسسة (عقد، إعلان، تقرير رسمي) زادت المراجعة.',
      'خمس عائلات من المهام النصية: <b>التوليد</b> (من نقاط إلى نص)، <b>التلخيص</b> (استخلاصي يقتبس، تجريدي يعيد الصياغة وقد يضيف أو يحذف)، <b>التحويل والترجمة</b> (مع <b>التوطين</b> الثقافي)، <b>الاستخراج والتصنيف</b> (منه <b>تحليل المشاعر</b>)، و<b>السؤال والجواب من نص معطى</b>.',
      'ما يفضح النص غير المراجَع: <b>الحشو</b> («في عالم اليوم المتسارع...»)، المبالغة، غياب التفاصيل المحلية، الأرقام غير الموثقة، المراجع التي لا وجود لها، والوعود (الصحية خاصة) التي يعاقب عليها قانون الإشهار. <b>الأصالة</b> تأتي من التفصيل الملموس الذي لا يعرفه إلا من يعرف المؤسسة: أنت.'],
      en:['The model excels at the <b>form</b> of text: wording, structure, tone, register. It is risky in <b>binding content</b>: facts, figures, promises, judgements about people. The rule: the closer a text gets to committing the organisation (a contract, an advert, an official report), the more review it needs.',
      'Five families of text tasks: <b>generation</b> (from bullet points to text), <b>summarisation</b> (extractive quotes; abstractive rephrases and may add or drop), <b>transformation and translation</b> (with cultural <b>localisation</b>), <b>extraction and classification</b> (including <b>sentiment analysis</b>), and <b>question answering from a given text</b>.',
      'What gives away an unreviewed text: <b>filler</b> ("in today\'s fast-moving world..."), exaggeration, absent local detail, undocumented figures, references that do not exist, and promises (health claims above all) that advertising law punishes. <b>Originality</b> comes from the concrete detail only someone who knows the organisation knows: you.']},
    lesson:{ar:'الطلاقة أسهل ما ينتجه النموذج؛ الجودة في الدقة والملاءمة والأصالة، وهي تأتي من سياقك ومراجعتك.',en:'Fluency is the easiest thing the model produces; quality lies in accuracy, fit and originality, and those come from your context and your review.'},
    terms:[
      {en:'Text generation',fr:'Génération de texte',ar:'توليد النصوص',s:{ar:'إنتاج نص كامل من نقاط أو وصف: رسالة، تقرير، منشور.',en:'Producing a full text from bullet points or a description: a letter, a report, a post.'},c:{ar:'النموذج يسوّد والإنسان يقرر.',en:'The model drafts; the human decides.'}},
      {en:'Extractive / Abstractive summarization',fr:'Résumé extractif / abstractif',ar:'التلخيص الاستخلاصي / التجريدي',s:{ar:'الاستخلاصي يقتبس جملًا من النص؛ التجريدي يعيد الصياغة وقد يضيف أو يحذف.',en:'Extractive quotes sentences from the text; abstractive rephrases and may add or drop.'},c:{ar:'النماذج تجريدية بطبعها: اطلب الاقتصار على النص وأرقام الصفحات.',en:'Models are abstractive by nature: ask to stick to the text and cite page numbers.'}},
      {en:'Sentiment analysis',fr:'Analyse de sentiments',ar:'تحليل المشاعر',s:{ar:'تصنيف موقف النص: إيجابي، سلبي، محايد؛ يُطبّق على آلاف التعليقات.',en:'Classifying a text\'s stance: positive, negative, neutral; applied to thousands of comments.'},c:{ar:'السخرية واللهجة تخدعه؛ راجع عينة.',en:'Sarcasm and dialect fool it; review a sample.'}},
      {en:'Localization',fr:'Localisation',ar:'التوطين',s:{ar:'ترجمة تراعي الثقافة والعملة والأمثلة والسجل المحلي، لا الكلمات فقط.',en:'Translation that adapts culture, currency, examples and local register, not just words.'},c:{ar:'اطلبه صراحة؛ الترجمة الافتراضية حرفية.',en:'Ask for it explicitly; default translation is literal.'}},
      {en:'Filler',fr:'Remplissage',ar:'الحشو',s:{ar:'جمل عامة بلا معلومة («في عالم اليوم المتسارع»)؛ أول علامة على نص غير مراجَع.',en:'Generic sentences with no information ("in today\'s fast-moving world"); the first sign of an unreviewed text.'},c:{ar:'احذفه أو استبدله بتفصيل محلي.',en:'Delete it or replace it with a local detail.'}},
      {en:'Misleading advertising',fr:'Publicité trompeuse',ar:'الخداع الإعلاني',s:{ar:'ادعاء غير مثبت في إعلان (وعد صحي، رقم مختلق، «الأفضل في الجزائر») يعاقب عليه القانون.',en:'An unproven claim in an advert (a health promise, a made-up figure, "the best in Algeria") punishable by law.'},c:{ar:'من نشر النص يُسأل عنه لا النموذج.',en:'Whoever publishes the text answers for it, not the model.'}}],
    activity:{id:'claims',title:{ar:'راجع المنشور قبل نشره',en:'Review the post before publishing'},
      text:{ar:'طلب مدير مطعم من نموذج كتابة منشور عن طبق كسكس جديد ونسخه كما هو. اقرأ الجمل وقرر لكل واحدة: تمرّ، أم تحتاج تحققًا/حذفًا قبل النشر؟',en:'A restaurant manager asked a model to write a post about a new couscous dish and copied it as is. Read the sentences and decide for each: passes, or needs checking/deletion before publishing?'},
      claims:[
        {t:{ar:'«في عالم اليوم المتسارع، يبحث الجميع عن لحظة أصالة.»',en:'"In today\'s fast-moving world, everyone seeks a moment of authenticity."'},bad:true,why:{ar:'حشو: جملة بلا معلومة تصلح لأي منتج.',en:'Filler: a sentence with no information that fits any product.'}},
        {t:{ar:'«طبق الكسكس بالخضر السبعة متوفر كل جمعة ابتداءً من 12:00.»',en:'"The seven-vegetable couscous is available every Friday from 12:00."'},bad:false,why:{ar:'معلومة محددة قابلة للتحقق من صاحب المطعم.',en:'A specific, checkable fact from the owner.'}},
        {t:{ar:'«وصفتنا تخفّض الكوليسترول وتقوي المناعة.»',en:'"Our recipe lowers cholesterol and boosts immunity."'},bad:true,why:{ar:'وعد صحي غير مثبت: خداع إعلاني يعاقب عليه القانون.',en:'An unproven health promise: misleading advertising, punishable by law.'}},
        {t:{ar:'«صُنّف مطعمنا الأول في الجزائر حسب دراسة 2024.»',en:'"Our restaurant was ranked first in Algeria by a 2024 study."'},bad:true,why:{ar:'دراسة مختلقة ورقم لا مصدر له.',en:'A fabricated study and an unsourced ranking.'}},
        {t:{ar:'«السعر: 1 200 دج للطبق، والحجز على الرقم [الرقم].»',en:'"Price: 1,200 DZD per dish; book on [number]."'},bad:false,why:{ar:'تفصيل عملي من صاحب المطعم.',en:'A practical detail from the owner.'}},
        {t:{ar:'«يُطهى على الطريقة التقليدية بخضر من سوق بومرداس.»',en:'"Cooked the traditional way with vegetables from the Boumerdès market."'},bad:false,why:{ar:'تفصيل محلي ملموس يصنع الأصالة (إن كان صحيحًا).',en:'A concrete local detail that creates originality (if true).'}},
        {t:{ar:'«99% من زبائننا يعودون في الأسبوع نفسه.»',en:'"99% of our customers come back the same week."'},bad:true,why:{ar:'رقم مختلق لم يُقس.',en:'A made-up figure nobody measured.'}}]},
    qs:[
      {k:'mcq',q:{ar:'التلخيص التجريدي:',en:'Abstractive summarisation:'},o:{ar:['يقتبس جملًا حرفيًا','يعيد الصياغة وقد يضيف أو يحذف','لا يخطئ أبدًا','مخصص للصور'],en:['Quotes sentences verbatim','Rephrases and may add or drop','Never errs','Is for images']},a:1,w:{ar:'لذلك اطلب الاقتصار على النص وراجع.',en:'Hence ask it to stick to the text and review.'}},
      {k:'multi',q:{ar:'علامات النص غير المراجَع (3 إجابات):',en:'Signs of an unreviewed text (3 answers):'},o:{ar:['الحشو','أرقام غير موثقة','تفاصيل محلية دقيقة','مراجع لا وجود لها'],en:['Filler','Undocumented figures','Precise local details','Non-existent references']},a:[0,1,3],w:{ar:'التفاصيل المحلية علامة جودة لا عيب.',en:'Local details are a mark of quality, not a flaw.'}},
      {k:'tf',q:{ar:'إذا كتب النموذج وعدًا صحيًا خاطئًا في الإعلان فالمسؤولية على النموذج.',en:'If the model writes a false health promise in an advert, the model is responsible.'},a:false,w:{ar:'من نشر النص يتحمل مسؤوليته قانونيًا وأخلاقيًا.',en:'Whoever publishes the text bears legal and ethical responsibility.'}}]},

  { id:'s2', n:'2', t:{ar:'من الوصف إلى الصورة: الانتشار والبذرة',en:'From description to image: diffusion and the seed'}, y:{ar:'نماذج الصور التوليدية',en:'Generative image models'},
    story:{ar:['الرؤية الكلاسيكية <b>تمييزية</b>: تجيب «ما هذا؟». النماذج التوليدية تنتج صورًا <b>جديدة</b> من وصف. التقنية المهيمنة اليوم <b>نموذج الانتشار (Diffusion model)</b> الذي خلف <b>الشبكات التوليدية التنافسية (GAN)</b>: مزوّر وشرطي يتنافسان.',
      'كيف يعمل الانتشار؟ في التدريب تُضاف <b>ضوضاء</b> إلى صور حقيقية تدريجيًا، ويتعلم النموذج عكس العملية: إزالة الضوضاء خطوة خطوة وفق الوصف. في التوليد يبدأ من ضوضاء عشوائية بحتة وينحت منها الصورة. لذلك <b>الوصف نفسه يعطي صورة مختلفة كل مرة</b>؛ ولتكرار النتيجة تُثبَّت <b>البذرة (Seed)</b>: الرقم الذي يولّد الضوضاء الأولى.',
      'أمر الصورة الجيد ستة عناصر: <b>الموضوع</b>، <b>المكان</b>، <b>الأسلوب</b>، <b>الإضاءة</b>، <b>الإطار</b>، <b>نسبة الأبعاد</b>، مع <b>أمر سلبي</b> لما لا تريده. وقبل النشر افحص الأيدي والنصوص داخل الصورة والانعكاسات والشعارات؛ هناك يخطئ المولّد أكثر.'],
      en:['Classical vision is <b>discriminative</b>: it answers "what is this?". Generative models produce <b>new</b> images from a description. Today\'s dominant technique is the <b>diffusion model</b>, successor to <b>GANs</b>: a forger and a detective competing.',
      'How does diffusion work? In training, <b>noise</b> is gradually added to real images and the model learns to reverse the process: removing noise step by step according to the description. At generation it starts from pure random noise and carves the image out of it. So <b>the same description gives a different image every time</b>; to repeat a result you lock the <b>seed</b>: the number that generates the initial noise.',
      'A good image prompt has six elements: <b>subject</b>, <b>setting</b>, <b>style</b>, <b>lighting</b>, <b>framing</b>, <b>aspect ratio</b>, plus a <b>negative prompt</b> for what you do not want. Before publishing, inspect hands, in-image text, reflections and logos; that is where generators err most.']},
    lesson:{ar:'المولّد لا يبحث عن صورة مشابهة ويلصقها؛ ينتج بكسلات جديدة من ضوضاء. وإن كان قد يعيد أحيانًا إنتاج صور شائعة في تدريبه.',en:'The generator does not search for a similar picture and paste it; it produces new pixels from noise. Though it may occasionally reproduce images common in its training.'},
    terms:[
      {en:'Diffusion model',fr:'Modèle de diffusion',ar:'نموذج الانتشار',s:{ar:'نموذج يتعلم إزالة الضوضاء من الصور وفق الوصف، ثم يولّد صورًا بالانطلاق من ضوضاء عشوائية.',en:'A model that learns to remove noise from images according to a description, then generates by starting from random noise.'},c:{ar:'التقنية وراء معظم مولّدات الصور الحالية.',en:'The technique behind most current image generators.'}},
      {en:'GAN (Generative Adversarial Network)',fr:'Réseau antagoniste génératif',ar:'الشبكة التوليدية التنافسية',s:{ar:'شبكتان تتنافسان: مولّد يزوّر ومميّز يكشف؛ كل واحدة تحسّن الأخرى.',en:'Two networks competing: a generator that forges and a discriminator that detects; each improves the other.'},c:{ar:'سبقت الانتشار وما زالت تُستعمل في مهام محددة.',en:'Preceded diffusion and is still used for specific tasks.'}},
      {en:'Seed',fr:'Graine',ar:'البذرة',s:{ar:'رقم يحدد الضوضاء الأولى؛ البذرة نفسها مع الوصف نفسه تعطي الصورة نفسها.',en:'A number fixing the initial noise; same seed with same prompt gives the same image.'},c:{ar:'سجّلها إذا أردت تعديل صورة أعجبتك.',en:'Record it if you want to tweak an image you liked.'}},
      {en:'Latent space',fr:'Espace latent',ar:'الفضاء الكامن',s:{ar:'تمثيل مضغوط للصورة تجري فيه عمليات الانتشار؛ أرخص من العمل على البكسلات مباشرة.',en:'A compressed representation of the image where diffusion operates; cheaper than working on raw pixels.'},c:{ar:'سبب سرعة المولّدات الحديثة.',en:'The reason modern generators are fast.'}},
      {en:'Image prompt',fr:'Invite d’image',ar:'أمر الصورة',s:{ar:'وصف بالعناصر الستة: الموضوع، المكان، الأسلوب، الإضاءة، الإطار، الأبعاد.',en:'A description with six elements: subject, setting, style, lighting, framing, aspect ratio.'},c:{ar:'العنصر المسكوت عنه يُملأ عشوائيًا.',en:'An unstated element gets filled randomly.'}},
      {en:'Negative prompt',fr:'Invite négative',ar:'الأمر السلبي',s:{ar:'قائمة ما لا تريده في الصورة: نص، أيدٍ مشوّهة، شعارات، ضبابية.',en:'A list of what you do not want in the image: text, deformed hands, logos, blur.'},c:{ar:'يقلل العيوب الشائعة ولا يلغيها.',en:'Reduces common defects but does not remove them.'}}],

        {id:'style',en:'Style',t:{ar:'الأسلوب',en:'Style'},opts:[{id:'photo',t:{ar:'صورة فوتوغرافية واقعية',en:'Realistic photograph'},p:'realistic photograph'},{id:'flat',t:{ar:'رسم مسطح للشعار',en:'Flat illustration'},p:'flat vector illustration'},{id:'water',t:{ar:'ألوان مائية',en:'Watercolour'},p:'watercolour painting'}]},
        {id:'lighting',en:'Lighting',t:{ar:'الإضاءة',en:'Lighting'},opts:[{t:{ar:'ضوء نهار دافئ',en:'Warm daylight'},p:'warm natural daylight',stops:['#FFE3A3','#FFB347'],x:0.3},{t:{ar:'ضوء استوديو بارد',en:'Cool studio light'},p:'cool soft studio lighting',stops:['#DCEBFF','#9CC4FF'],x:0.5},{t:{ar:'إضاءة درامية مسائية',en:'Dramatic evening light'},p:'dramatic low-key evening lighting',stops:['#FF9A5A','#3B1F4A'],x:0.8}]},
        {id:'framing',en:'Framing',t:{ar:'الإطار',en:'Framing'},opts:[{t:{ar:'لقطة قريبة',en:'Close-up'},p:'close-up shot',scale:1.5},{t:{ar:'لقطة متوسطة',en:'Medium shot'},p:'medium shot',scale:1},{t:{ar:'لقطة واسعة',en:'Wide shot'},p:'wide shot',scale:0.6}]},
        {id:'aspect',en:'Aspect ratio',t:{ar:'نسبة الأبعاد',en:'Aspect ratio'},opts:[{t:{ar:'مربع 1:1 (منشور)',en:'Square 1:1 (post)'},p:'--ar 1:1',wh:[300,300]},{t:{ar:'عمودي 9:16 (قصة)',en:'Portrait 9:16 (story)'},p:'--ar 9:16',wh:[180,320]},{t:{ar:'أفقي 16:9 (لافتة)',en:'Landscape 16:9 (banner)'},p:'--ar 16:9',wh:[320,180]}]}]},
    qs:[
      {k:'mcq',q:{ar:'لماذا يعطي الوصف نفسه صورة مختلفة كل مرة؟',en:'Why does the same description give a different image each time?'},o:{ar:['لأن النموذج يتعلم بين الطلبات','لأن البداية ضوضاء عشوائية مختلفة','لأن الإنترنت يتغير','لا يحدث ذلك'],en:['Because the model learns between requests','Because it starts from different random noise','Because the internet changes','It does not happen']},a:1,w:{ar:'ثبّت البذرة لتكرار النتيجة.',en:'Lock the seed to repeat the result.'}},
      {k:'multi',q:{ar:'العناصر الستة لأمر الصورة تشمل (اختر 3 مما يلي):',en:'The six image-prompt elements include (pick 3 of these):'},o:{ar:['الإضاءة','نسبة الأبعاد','اسم الشركة المصنّعة للنموذج','الإطار'],en:['Lighting','Aspect ratio','The model vendor\'s name','Framing']},a:[0,1,3],w:{ar:'الموضوع والمكان والأسلوب والإضاءة والإطار والأبعاد.',en:'Subject, setting, style, lighting, framing and aspect ratio.'}},
      {k:'tf',q:{ar:'المولّد يبحث عن صورة مشابهة على الإنترنت ويلصقها.',en:'The generator searches the internet for a similar image and pastes it.'},a:false,w:{ar:'ينتج بكسلات جديدة من ضوضاء وفق الوصف.',en:'It produces new pixels from noise according to the description.'}}]},

  { id:'s3', n:'3', t:{ar:'مكالمة من «المدير»: التزييف العميق',en:'A call from "the boss": deepfakes'}, y:{ar:'الصوت والاستنساخ والدفاع الإجرائي',en:'Audio, cloning and procedural defence'},
    story:{ar:['الصوت أربع عائلات: <b>التعرف على الكلام (ASR)</b>: صوت ← نص؛ <b>تحويل النص إلى كلام (TTS)</b>: نص ← صوت؛ <b>استنساخ الصوت</b>: صوت شخص معيّن من عينة قصيرة (دقيقة تكفي)؛ وتوليد الموسيقى. الاستنساخ أداة إنتاج (تعليق صوتي، مساعد بصوت المؤسسة) وأداة احتيال في آن.',
      '<b>التزييف العميق (Deepfake)</b>: فيديو أو صوت يجعل شخصًا حقيقيًا يقول أو يفعل ما لم يقل أو يفعل. السيناريو الأشهر في المؤسسات: مكالمة أو رسالة صوتية «من المدير» تطلب تحويلًا عاجلًا وسريًا. المدير الذي تعرفه صوته لا يحميك؛ الاستنساخ يخدع الأقارب.',
      'الدفاع <b>إجرائي لا سمعي</b>: <b>قناة ثانية</b> (معاودة الاتصال على الرقم المعروف لا الرقم المتصل)، <b>موافقة مزدوجة</b> على كل تحويل فوق سقف، كلمة اتفاق داخلية، ورفض «العجلة والسرية» معًا لأنهما توقيع الاحتيال. كواشف التزييف و<b>الوسم الرقمي</b> و<b>مصدر المحتوى (C2PA)</b> تساعد لكنها تتأخر وتخطئ.'],
      en:['Audio comes in four families: <b>speech recognition (ASR)</b>: audio → text; <b>text-to-speech (TTS)</b>: text → audio; <b>voice cloning</b>: a specific person\'s voice from a short sample (a minute suffices); and music generation. Cloning is both a production tool (voice-over, a branded assistant) and a fraud tool.',
      'A <b>deepfake</b>: a video or audio that makes a real person say or do what they never said or did. The best-known corporate scenario: a call or voice message "from the boss" requesting an urgent, confidential transfer. Knowing your boss\'s voice does not protect you; cloning fools relatives.',
      'Defence is <b>procedural, not auditory</b>: a <b>second channel</b> (call back on the known number, not the calling one), <b>dual approval</b> for any transfer above a threshold, an internal code word, and refusing "urgent and confidential" together, since that pair is fraud\'s signature. Deepfake detectors, <b>watermarking</b> and <b>content provenance (C2PA)</b> help, but they lag and err.']},
    lesson:{ar:'«أعرف صوت مديري فلن أُخدع» أخطر جملة في المؤسسة؛ الإجراء يحمي، الأذن لا.',en:'"I know my boss\'s voice, I won\'t be fooled" is the most dangerous sentence in the company; procedure protects, ears do not.'},
    terms:[
      {en:'Speech recognition (ASR)',fr:'Reconnaissance vocale',ar:'التعرف على الكلام',s:{ar:'تحويل الصوت إلى نص: محاضر الاجتماعات، الترجمة الفورية، المساعدات الصوتية.',en:'Converting audio to text: meeting minutes, live subtitles, voice assistants.'},c:{ar:'الدارجة والضجيج يرفعان الخطأ؛ راجع المحضر.',en:'Dialect and noise raise errors; review the minutes.'}},
      {en:'Text-to-speech (TTS)',fr:'Synthèse vocale',ar:'تحويل النص إلى كلام',s:{ar:'توليد صوت طبيعي من نص بأي لغة ونبرة.',en:'Generating natural speech from text in any language and tone.'},c:{ar:'أساس الردود الآلية والتعليق الصوتي.',en:'The basis of automated replies and voice-over.'}},
      {en:'Voice cloning',fr:'Clonage vocal',ar:'استنساخ الصوت',s:{ar:'إعادة إنتاج صوت شخص معيّن من عينة قصيرة ليقول أي نص.',en:'Reproducing a specific person\'s voice from a short sample to say any text.'},c:{ar:'يحتاج موافقة صاحب الصوت؛ وبدونها أداة احتيال.',en:'Needs the voice owner\'s consent; without it, a fraud tool.'}},
      {en:'Deepfake',fr:'Hypertrucage',ar:'التزييف العميق',s:{ar:'محتوى مولّد يجعل شخصًا حقيقيًا يقول أو يفعل ما لم يقل أو يفعل.',en:'Generated content making a real person say or do what they never did.'},c:{ar:'الاحتيال المالي والتشهير أشهر استعمالاته الضارة.',en:'Financial fraud and defamation are its best-known harmful uses.'}},
      {en:'Watermarking',fr:'Tatouage numérique',ar:'الوسم الرقمي',s:{ar:'علامة خفية تُضمَّن في المحتوى المولّد لتمييزه لاحقًا.',en:'A hidden mark embedded in generated content to identify it later.'},c:{ar:'يمكن إزالته أحيانًا؛ لا يُعتمد عليه وحده.',en:'Can sometimes be stripped; never relied on alone.'}},
      {en:'Content provenance (C2PA)',fr:'Provenance du contenu',ar:'مصدر المحتوى',s:{ar:'معيار يرفق بالصورة أو الفيديو بيانات أصلها: من أنشأها وبأي أداة وما التعديلات.',en:'A standard attaching origin data to an image or video: who made it, with which tool, what edits.'},c:{ar:'ينتشر في الكاميرات والمولّدات تدريجيًا.',en:'Spreading gradually through cameras and generators.'}}],
    activity:{id:'scenario',title:{ar:'الخميس 16:45: تحويل عاجل',en:'Thursday 16:45: an urgent transfer'},
      meters:[{id:'cash',t:{ar:'أموال المؤسسة',en:'Company funds'},start:100},{id:'trust',t:{ar:'ثقة الإدارة بك',en:'Management\'s trust in you'},start:60},{id:'time',t:{ar:'الوقت المتبقي',en:'Time left'},start:60}],
      scenes:[
        {text:{ar:'أنت محاسب في شركة توزيع. رسالة صوتية على واتساب من رقم مجهول بصوت المدير العام نفسه: «أنا في اجتماع مع شريك أجنبي، حوّل 2.8 مليون دج فورًا إلى هذا الحساب لإتمام الصفقة، ولا تخبر أحدًا حتى أعلن الخبر.» ماذا تفعل؟',en:'You are an accountant at a distribution company. A WhatsApp voice note from an unknown number, in the CEO\'s own voice: "I am in a meeting with a foreign partner; transfer 2.8 million DZD immediately to this account to close the deal, and tell no one until I announce it." What do you do?'},
         choices:[
          {t:{ar:'أنفذ فورًا: الصوت صوته بلا شك',en:'Execute at once: it is unmistakably his voice'},fx:{cash:-60,trust:-40},good:false,why:{ar:'دقيقة من صوته في فيديو عام تكفي لاستنساخه. «العاجل والسري» معًا توقيع الاحتيال.',en:'A minute of his voice from a public video is enough to clone it. "Urgent and confidential" together is fraud\'s signature.'}},
          {t:{ar:'أعاود الاتصال بالمدير على رقمه المعروف في دليل الشركة',en:'Call the CEO back on his known number from the company directory'},fx:{time:-10,trust:10},good:true,why:{ar:'القناة الثانية: لا ترد على الرقم المتصل بل على الرقم الذي تعرفه.',en:'The second channel: do not reply to the calling number; use the one you know.'}},
          {t:{ar:'أرد على الرسالة بسؤال: «هل أنت المدير فعلًا؟»',en:'Reply to the message asking: "Is this really you?"'},fx:{time:-15},good:false,why:{ar:'المحتال سيجيب «نعم» بصوته المستنسخ. التحقق يكون بقناة لا يتحكم بها المرسل.',en:'The fraudster will answer "yes" in the cloned voice. Verification must use a channel the sender does not control.'}}]},
        {text:{ar:'المدير لا يرد (هاتفه مغلق في الاجتماع). تصل رسالة صوتية ثانية أكثر حدة: «لماذا التأخير؟ سنخسر الصفقة خلال عشر دقائق!»',en:'The CEO does not answer (phone off in the meeting). A second, sharper voice note arrives: "Why the delay? We lose the deal in ten minutes!"'},
         choices:[
          {t:{ar:'أحوّل الآن؛ الضغط حقيقي ولا أريد أن أكون سبب الخسارة',en:'Transfer now; the pressure is real and I will not be blamed for the loss'},fx:{cash:-60,trust:-40},good:false,why:{ar:'الضغط الزمني أداة الاحتيال الأولى. صفقة حقيقية لا تُفقد لأن المحاسب تحقق.',en:'Time pressure is fraud\'s first tool. No real deal is lost because the accountant verified.'}},
          {t:{ar:'أطبّق إجراء الموافقة المزدوجة: أي تحويل فوق السقف يحتاج توقيع المدير المالي أيضًا',en:'Apply dual approval: any transfer above the threshold also needs the CFO\'s signature'},fx:{trust:15,time:-10},good:true,why:{ar:'الإجراء يحميك من الاحتيال ومن اللوم معًا.',en:'Procedure protects you from the fraud and from blame alike.'}},
          {t:{ar:'أحوّل نصف المبلغ كحل وسط',en:'Transfer half the amount as a compromise'},fx:{cash:-30,trust:-30},good:false,why:{ar:'لا يوجد «نصف احتيال». التحقق أو لا شيء.',en:'There is no "half fraud". Verify or nothing.'}}]},
        {text:{ar:'المدير المالي يسأل: «كيف نتأكد؟». أمامك دقائق.',en:'The CFO asks: "How do we make sure?" You have minutes.'},
         choices:[
          {t:{ar:'أمرّر الرسالة الصوتية على كاشف تزييف مجاني على الإنترنت وأعتمد نتيجته',en:'Run the voice note through a free online deepfake detector and trust its verdict'},fx:{time:-20},good:false,why:{ar:'الكواشف تتأخر عن المولّدات وتخطئ، ورفع تسجيل داخلي لموقع مجهول خطر بذاته.',en:'Detectors lag behind generators and err, and uploading an internal recording to an unknown site is itself a risk.'}},
          {t:{ar:'نتصل بسكرتارية المدير ونطلب إخراجه من الاجتماع للتأكيد الشفهي، ونطلب كلمة الاتفاق الداخلية',en:'Call the CEO\'s office, have him step out of the meeting to confirm verbally, and ask for the internal code word'},fx:{trust:15,time:-10},good:true,why:{ar:'تحقق بشري عبر قناة موثوقة + سر مشترك مسبق.',en:'Human verification through a trusted channel + a pre-agreed shared secret.'}},
          {t:{ar:'نطلب من المرسل مكالمة فيديو للتأكد من وجهه',en:'Ask the sender for a video call to see his face'},fx:{time:-15},good:false,why:{ar:'الفيديو يُزيَّف أيضًا في الزمن الحقيقي. الفيصل القناة لا الوسيط.',en:'Video is faked in real time too. The channel matters, not the medium.'}}]},
        {text:{ar:'اتضح أنها محاولة احتيال؛ الحساب في بنك أجنبي والمدير لم يطلب شيئًا. ماذا تفعل بعد ذلك؟',en:'It turns out to be a fraud attempt; the account is in a foreign bank and the CEO asked for nothing. What do you do next?'},
         choices:[
          {t:{ar:'أحذف الرسائل وأنسى الموضوع لتجنب الإحراج',en:'Delete the messages and forget it to avoid embarrassment'},fx:{trust:-20},good:false,why:{ar:'المحاولة ستتكرر مع زميل آخر. التبليغ يحمي الجميع.',en:'The attempt will be repeated on a colleague. Reporting protects everyone.'}},
          {t:{ar:'أبلّغ الإدارة وأحفظ الأدلة وأقترح تعميم إجراء القناة الثانية والموافقة المزدوجة على الجميع',en:'Report to management, keep the evidence, and propose rolling out the second-channel and dual-approval procedure to everyone'},fx:{trust:20},good:true,why:{ar:'الدفاع إجرائي ومؤسسي: الإجراء المكتوب يحمي من لا يعرف صوت المدير أصلًا.',en:'Defence is procedural and institutional: a written procedure protects even those who never knew the boss\'s voice.'}},
          {t:{ar:'أنشر الرسالة الصوتية على صفحات التواصل للتحذير',en:'Post the voice note on social media as a warning'},fx:{trust:-15},good:false,why:{ar:'نشر صوت المدير المستنسخ يضر بسمعته ويُسهّل استنساخه مجددًا؛ التبليغ يكون للجهات المختصة.',en:'Publishing the cloned voice harms his reputation and eases further cloning; report to the competent parties.'}}]}],
      ending:(m,g)=>g>=4?{ar:'لم تخسر الشركة دينارًا، وصار اسمك مرادفًا للإجراء السليم. الدفاع عن التزييف العميق لم يكن في أذنك بل في خطواتك.',en:'The company lost not a single dinar, and your name became synonymous with sound procedure. The defence against deepfakes was never in your ears but in your steps.'}:m.cash<100?{ar:'خسرت الشركة جزءًا من أموالها. المشكلة لم تكن أذنك بل غياب الإجراء: قناة ثانية، موافقة مزدوجة، ولا «عاجل وسري» معًا.',en:'The company lost part of its funds. The problem was never your ears but the missing procedure: a second channel, dual approval, and never "urgent and confidential" together.'}:{ar:'نجوت لكن بقرارات مترددة. اكتب الإجراء الآن حتى لا تحتاج إلى الحظ في المرة القادمة.',en:'You survived, but with hesitant decisions. Write the procedure now so you need no luck next time.'}},
    qs:[
      {k:'mcq',q:{ar:'الدفاع الأهم ضد احتيال استنساخ الصوت:',en:'The most important defence against voice-cloning fraud:'},o:{ar:['تدريب الأذن على كشف الصوت المزيف','إجراء: قناة ثانية وموافقة مزدوجة','تغيير رقم الهاتف','كاشف تزييف مجاني'],en:['Training the ear to detect fake voices','Procedure: a second channel and dual approval','Changing the phone number','A free deepfake detector']},a:1,w:{ar:'الدفاع إجرائي لا سمعي.',en:'Defence is procedural, not auditory.'}},
      {k:'mcq',q:{ar:'التعرف على الكلام (ASR) هو:',en:'Speech recognition (ASR) is:'},o:{ar:['نص ← صوت','صوت ← نص','صوت ← صورة','استنساخ الصوت'],en:['Text → audio','Audio → text','Audio → image','Voice cloning']},a:1,w:{ar:'عكسه تحويل النص إلى كلام (TTS).',en:'Its reverse is text-to-speech (TTS).'}},
      {k:'tf',q:{ar:'كاشف التزييف يحسم إن كان المقطع مزيفًا.',en:'A deepfake detector settles whether a clip is fake.'},a:false,w:{ar:'الكواشف تتأخر وتخطئ؛ التحقق من المصدر والقناة الثانية أهم.',en:'Detectors lag and err; verifying the source and a second channel matter more.'}}]},

  { id:'s4', n:'4', t:{ar:'أين الخط؟ الأكاديمي والقانوني',en:'Where is the line? Academic and legal'}, y:{ar:'التصريح، الانتحال، حقوق المؤلف، الإشهار',en:'Disclosure, plagiarism, copyright, advertising'},
    story:{ar:['أكاديميًا، المشروع: الفهم والشرح، العصف الذهني، نقد مسودتك، التدقيق اللغوي، مع <b>التصريح باستعمال الذكاء الاصطناعي</b> عند الاقتضاء (أين وكيف استُعمل). غير المشروع: تسليم نص مولّد كاملًا، مراجع لم تتحقق منها، <b>اختلاق البيانات</b> (نتائج لم تُجمع)، والانتحال المقنّع: إعادة صياغة فكرة غيرك بالنموذج لا تنفي <b>الانتحال</b>، لأن الفكرة تبقى لصاحبها. والتصريح شرط لا ترخيص: لا يحوّل غير المشروع إلى مشروع.',
      'قانونيًا، <b>حقوق المؤلف</b> على التدريب والمخرجات ما زالت أسئلة مفتوحة في العالم؛ في بعض الدول لا تُحمى الصورة المولّدة بلا إسهام بشري، فلا تظن أنك تملكها حصريًا. لكن ما ليس مفتوحًا: <b>العلامات التجارية</b> (شعار منافس في صورتك)، حق الشخص في صورته وصوته، و<b>قانون الإشهار</b>: صورة طبق مولّدة أجمل من الطبق الحقيقي خداع إعلاني.',
      'الحساب الاقتصادي: التوليد البصري يخفّض كلفة المسودات والمتغيرات (عشر نسخ من لافتة في دقائق)، ويرفع قيمة ما لا يولَّد: الصورة الحقيقية للمنتج الحقيقي، والمراجعة القانونية قبل أي حملة: الترخيص، التشابه، التضليل.'],
      en:['Academically, legitimate: understanding and explanation, brainstorming, critiquing your draft, proofreading, with <b>AI-use disclosure</b> where required (where and how it was used). Illegitimate: submitting a fully generated text, references you did not verify, <b>data fabrication</b> (results never collected), and disguised plagiarism: rephrasing someone\'s idea with the model does not undo <b>plagiarism</b>, because the idea stays theirs. Disclosure is a condition, not a licence: it does not turn the illegitimate into the legitimate.',
      'Legally, <b>copyright</b> on training and outputs remains an open question worldwide; in some countries a generated image is not protected without human contribution, so do not assume you own it exclusively. What is not open: <b>trademarks</b> (a competitor\'s logo in your image), a person\'s right to their image and voice, and <b>advertising law</b>: a generated dish photo prettier than the real dish is misleading advertising.',
      'The economics: visual generation cuts the cost of drafts and variants (ten versions of a banner in minutes) and raises the value of what cannot be generated: the real photo of the real product, and the legal review before any campaign: licence, likeness, deception.']},
    lesson:{ar:'التصريح باستعمال الذكاء الاصطناعي يبيح ما كان مشروعًا أصلًا، ولا يبيح نصًا كاملًا مولّدًا ولا بيانات مختلقة.',en:'AI-use disclosure permits what was legitimate anyway; it does not permit a fully generated text or fabricated data.'},
    terms:[
      {en:'AI-use disclosure',fr:'Déclaration d’usage de l’IA',ar:'التصريح باستعمال الذكاء الاصطناعي',s:{ar:'بيان أين وكيف استُعمل النموذج في العمل: للتدقيق، للعصف، لمسودة قسم.',en:'A statement of where and how the model was used in the work: proofreading, brainstorming, drafting a section.'},c:{ar:'شرط للمشروع لا ترخيص لغير المشروع.',en:'A condition for the legitimate, not a licence for the illegitimate.'}},
      {en:'Plagiarism',fr:'Plagiat',ar:'الانتحال',s:{ar:'نسبة عمل أو فكرة غيرك إلى نفسك، حتى بعد إعادة الصياغة.',en:'Claiming someone else\'s work or idea as your own, even after rephrasing.'},c:{ar:'الانتحال في الفكرة لا في الكلمات فقط.',en:'Plagiarism is in the idea, not only the words.'}},
      {en:'Data fabrication',fr:'Fabrication de données',ar:'اختلاق البيانات',s:{ar:'اختراع نتائج أو أرقام أو مقابلات لم تُجمع فعلًا.',en:'Inventing results, figures or interviews never actually collected.'},c:{ar:'أخطر مخالفة أكاديمية؛ النموذج يسهّلها لأنه يولّد جداول مقنعة.',en:'The gravest academic offence; the model makes it easy because it generates convincing tables.'}},
      {en:'Copyright',fr:'Droit d’auteur',ar:'حقوق المؤلف',s:{ar:'حماية الأعمال الإبداعية؛ مدى شمولها للتدريب والمخرجات المولّدة ما زال محل نزاع.',en:'Protection of creative works; whether it covers training and generated outputs is still disputed.'},c:{ar:'لا تفترض أنك تملك الصورة المولّدة حصريًا.',en:'Do not assume you own a generated image exclusively.'}},
      {en:'Trademark',fr:'Marque déposée',ar:'العلامة التجارية',s:{ar:'الاسم والشعار المحميان؛ ظهور علامة غيرك في صورتك المولّدة انتهاك.',en:'The protected name and logo; another\'s mark appearing in your generated image is an infringement.'},c:{ar:'أضف «بلا شعارات» في الأمر السلبي وافحص.',en:'Add "no logos" to the negative prompt and inspect.'}},
      {en:'Human-in-the-loop writing',fr:'Rédaction avec humain dans la boucle',ar:'الكتابة بإنسان في الحلقة',s:{ar:'النموذج يسوّد والإنسان يراجع ويقرر ويوقّع.',en:'The model drafts; the human reviews, decides and signs.'},c:{ar:'من يوقّع يتحمل، فلا توقّع ما لم تقرأ.',en:'Whoever signs is liable, so never sign what you have not read.'}}],
    activity:{id:'sorter',title:{ar:'مشروع أم غير مشروع؟',en:'Legitimate or not?'},rounds:[
      {title:{ar:'الجولة 1: في بحث التخرج',en:'Round 1: in the graduation thesis'},buckets:[{id:'ok',t:{ar:'مشروع (مع التصريح عند الاقتضاء)',en:'Legitimate (with disclosure where required)'}},{id:'no',t:{ar:'غير مشروع',en:'Illegitimate'}}],
       items:[
        {t:{ar:'أطلب من النموذج شرح مفهوم «المرونة السعرية» بثلاث طرق لأفهمه',en:'Ask the model to explain "price elasticity" three ways so I understand it'},b:'ok',why:{ar:'فهم وتعلم.',en:'Understanding and learning.'}},
        {t:{ar:'أطلب منه كتابة الفصل الثاني كاملًا وأسلّمه باسمي',en:'Ask it to write chapter two in full and submit it as mine'},b:'no',why:{ar:'نص مولّد كاملًا؛ التصريح لا يبيحه.',en:'A fully generated text; disclosure does not permit it.'}},
        {t:{ar:'أطلب منه نقد مسودتي وتحديد نقاط الضعف في الحجة',en:'Ask it to critique my draft and point out weak arguments'},b:'ok',why:{ar:'نقد لمسودة كتبتها أنت.',en:'Critique of a draft you wrote.'}},
        {t:{ar:'أطلب منه جدول نتائج استبيان لم أوزعه بعد لأن الوقت ضيق',en:'Ask it for a results table of a survey I never distributed, since time is short'},b:'no',why:{ar:'اختلاق بيانات: أخطر مخالفة.',en:'Data fabrication: the gravest offence.'}},
        {t:{ar:'أنسخ المراجع التي اقترحها دون فتحها لأنها تبدو حقيقية',en:'Copy the references it suggested without opening them since they look real'},b:'no',why:{ar:'مراجع مهلوسة شائعة؛ كل مرجع يُفتح ويُقرأ.',en:'Hallucinated references are common; every reference gets opened and read.'}},
        {t:{ar:'أستعمله لتدقيق الإملاء والصياغة في نصي وأذكر ذلك في التصريح',en:'Use it to proofread spelling and wording in my text and say so in the disclosure'},b:'ok',why:{ar:'تدقيق مع تصريح.',en:'Proofreading with disclosure.'}},
        {t:{ar:'أعيد صياغة فكرة من مقال زميل بالنموذج وأنسبها لنفسي بلا إحالة',en:'Rephrase an idea from a colleague\'s article with the model and claim it without citation'},b:'no',why:{ar:'انتحال مقنّع: الفكرة تبقى لصاحبها.',en:'Disguised plagiarism: the idea stays its owner\'s.'}}]},
      {title:{ar:'الجولة 2: في حملة إعلانية',en:'Round 2: in an advertising campaign'},buckets:[{id:'ok',t:{ar:'آمن قانونيًا',en:'Legally safe'}},{id:'no',t:{ar:'خطر قانوني',en:'Legal risk'}}],
       items:[
        {t:{ar:'عشر نسخ مولّدة من تصميم اللافتة لاختيار الأفضل داخليًا',en:'Ten generated versions of the banner design to choose internally'},b:'ok',why:{ar:'مسودات داخلية: الاستعمال الأمثل للتوليد.',en:'Internal drafts: the ideal use of generation.'}},
        {t:{ar:'صورة مولّدة للطبق أجمل بكثير من الطبق الفعلي في الإعلان',en:'A generated dish image far prettier than the actual dish in the advert'},b:'no',why:{ar:'خداع إعلاني يعاقب عليه القانون.',en:'Misleading advertising, punishable by law.'}},
        {t:{ar:'صورة مولّدة يظهر فيها شعار منافس على طاولة',en:'A generated image showing a competitor\'s logo on a table'},b:'no',why:{ar:'انتهاك علامة تجارية.',en:'Trademark infringement.'}},
        {t:{ar:'استنساخ صوت ممثل مشهور للإعلان دون إذنه',en:'Cloning a famous actor\'s voice for the advert without permission'},b:'no',why:{ar:'حق الشخص في صوته وصورته.',en:'A person\'s right to their voice and image.'}},
        {t:{ar:'تعليق صوتي بصوت مولّد عام (غير مستنسخ من شخص حقيقي)',en:'A voice-over in a generic generated voice (not cloned from a real person)'},b:'ok',why:{ar:'لا حق شخصي منتهك.',en:'No personal right infringed.'}},
        {t:{ar:'اعتبار الصورة المولّدة ملكًا حصريًا ومنع المنافسين قضائيًا من صور مشابهة',en:'Treating the generated image as exclusive property and suing competitors over similar ones'},b:'no',why:{ar:'الملكية محل خلاف؛ قد لا تُحمى بلا إسهام بشري.',en:'Ownership is disputed; may be unprotected without human contribution.'}}]}]},
    qs:[

      {k:'mcq',q:{ar:'التصريح باستعمال الذكاء الاصطناعي:',en:'AI-use disclosure:'},o:{ar:['يبيح تسليم نص مولّد كاملًا','شرط للمشروع ولا يحوّل غير المشروع إلى مشروع','غير مطلوب أبدًا','يُكتب في آخر صفحة فقط'],en:['Permits submitting a fully generated text','A condition for the legitimate; does not legitimise the illegitimate','Never required','Written on the last page only']},a:1,w:{ar:'شرط لا ترخيص.',en:'A condition, not a licence.'}},

    ['الصور','الانتشار ينحت الصورة من ضوضاء؛ الوصف نفسه ≠ الصورة نفسها إلا بتثبيت البذرة؛ ستة عناصر + أمر سلبي + فحص الأيدي والنصوص.'],
    ['الصوت','ASR وTTS واستنساخ؛ الاستنساخ يخدع الأقارب؛ الدفاع إجرائي: قناة ثانية، موافقة مزدوجة، لا «عاجل وسري» معًا.'],
