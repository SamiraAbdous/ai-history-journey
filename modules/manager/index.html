<script>
(function(){
  Course.widget('pricing',function(el,data,ctx){
    const L=ctx.L,ar=ctx.lang==='ar';let i=0,price=200,results=[];
    const lab=ar?{intro:'أنت مسؤول التسعير في تطبيق نقل. حرّك السعر وراقب الطلب والسعة والانتظار والإيراد، ثم اعتمد السعر لكل حالة.',price:'سعر الرحلة (دج)',demand:'الطلب (رحلة/ساعة)',cap:'السعة (سيارة/ساعة)',rev:'الإيراد (دج/ساعة)',wait:'الانتظار (دقيقة)',adopt:'اعتمد هذا السعر',next:'الحالة التالية ←',finish:'النتيجة',good:'قرارات متوازنة',unmet:'طلب غير مخدوم',cap2:'سقف التنظيم'}
                :{intro:'You run pricing at a ride-hailing app. Move the price and watch demand, capacity, waiting and revenue, then adopt a price for each situation.',price:'Ride price (DZD)',demand:'Demand (rides/hour)',cap:'Capacity (cars/hour)',rev:'Revenue (DZD/hour)',wait:'Waiting (minutes)',adopt:'Adopt this price',next:'Next situation →',finish:'Result',good:'Balanced decisions',unmet:'unserved demand',cap2:'regulatory cap'};
    function calc(s,P){const d=Math.round(s.d0*Math.pow(P/200,-s.e));const served=Math.min(d,s.cap);const rev=served*P;const wait=d>s.cap?Math.round(2+(d/s.cap-1)*25):2;return{d,served,rev,wait,unmet:Math.max(0,d-s.cap)};}
    function render(){
      const s=data.sits[i];
      if(!s){const g=results.filter(r=>r.ok).length;el.innerHTML=`<div class="result"><b>${lab.finish}</b><div>${lab.good}: ${g} / ${data.sits.length}</div>${results.map((r,k)=>`<div class="fb ${r.ok?'ok':'bad'}" style="margin-top:6px"><b>${L(data.sits[k].t)}: ${r.P} ${ar?'دج':'DZD'}</b> — ${L(r.ok?data.sits[k].okWhy:data.sits[k].badWhy)}</div>`).join('')}</div>`;ctx.done(g,data.sits.length);return;}
      const c=calc(s,price);
      el.innerHTML=`<p class="hint">${lab.intro}</p><div class="sit"><h4>${i+1}/${data.sits.length} · ${L(s.t)}</h4><p>${L(s.text)}</p>
      <div class="price">${price} ${ar?'دج':'DZD'}</div><input type="range" class="slider" id="pr" min="100" max="1000" step="10" value="${price}"><div class="hint" style="display:flex;justify-content:space-between"><span>100</span><span>${lab.price}</span><span>1000</span></div>
      <div class="bars"><div>${lab.demand}<b>${c.d}</b>${c.unmet?`<span class="hint">${c.unmet} ${lab.unmet}</span>`:''}</div><div>${lab.cap}<b>${s.cap}</b></div><div>${lab.rev}<b>${c.rev.toLocaleString('en')}</b></div><div>${lab.wait}<b>${c.wait}</b></div>${s.capPrice?`<div>${lab.cap2}<b>${s.capPrice}</b></div>`:''}</div>
      <div class="row"><button type="button" class="btn" id="adopt">${lab.adopt}</button></div></div>`;
      el.querySelector('#pr').addEventListener('input',e=>{price=+e.target.value;const c2=calc(s,price);el.querySelector('.price').textContent=`${price} ${ar?'دج':'DZD'}`;const bs=el.querySelectorAll('.bars b');bs[0].textContent=c2.d;bs[2].textContent=c2.rev.toLocaleString('en');bs[3].textContent=c2.wait;const un=el.querySelector('.bars .hint');if(un)un.textContent=c2.unmet?`${c2.unmet} ${lab.unmet}`:'';});
      el.querySelector('#adopt').addEventListener('click',()=>{results.push({P:price,ok:price>=s.lo&&price<=s.hi});i++;render();});
    }
    if(ctx.state.done){el.innerHTML=`<p class="fb ok">${lab.finish}: ${ctx.state.score} / ${ctx.state.max}</p>`;return;}
    render();
  });
})();

Course.init({
  slug:'manager',
  lectures:{ar:'محور الذكاء الاصطناعي في الاقتصاد',en:'AI in the economy topic'},
  title:{ar:'المدير والذكاء الاصطناعي',en:'The Manager and AI'},
  sub:{ar:'لعبة قرارات اقتصادية في أربع جولات: تفصل التنبؤ عن الحكم، تواجه مورّدًا يبيع نموذجًا «بدقة 98%»، تدير التسعير الديناميكي بين الإيراد والإنصاف، ثم تفكّك وظيفة إلى مهام لترى ما يُؤتمت فعلًا. قراءة اقتصادية لا تسويقية.',en:'An economic decision game in four rounds: separate prediction from judgement, face a vendor selling a "98% accurate" model, run dynamic pricing between revenue and fairness, then break a job into tasks to see what really gets automated. An economist\'s reading, not a marketer\'s.'},
  how:{ar:['الجولة 2 لعبة قرار بثلاثة عدادات: رأس المال، سمعة البنك، ثقة مجلس الإدارة.','الجولة 3 محاكٍ: حرّك السعر وراقب الأرقام قبل الاعتماد.','كل نشاط يُحتسب نقاطًا والتحدي يفتح الجولة التالية.'],
       en:['Round 2 is a decision game with three meters: capital, bank reputation, board confidence.','Round 3 is a simulator: move the price and watch the numbers before adopting.','Every activity counts as points and the challenge unlocks the next round.']},
  sections:[
  { id:'s1', n:'1', t:{ar:'القرار = تنبؤ + حكم',en:'Decision = prediction + judgement'}, y:{ar:'الإطار الاقتصادي',en:'The economic frame'},
    story:{ar:['اقتصاديًا، الذكاء الاصطناعي شيء واحد: <b>انخفاض حاد في تكلفة التنبؤ</b>. وكل قرار يتكوّن من جزأين: <b>التنبؤ</b> (ما الذي سيحدث؟ احتمال تخلف الزبون 12%) و<b>الحكم</b> (ماذا نفضّل، وكم يكلفنا كل نوع من الخطأ؟). الآلة تهيمن على الأول، فيصبح الثاني أندر وأغلى.',
      'قاعدة الاقتصاد: حين ينخفض سعر شيء يرتفع الطلب على <b>مكمّلاته</b> وينخفض على <b>بدائله</b>. مكمّلات التنبؤ الرخيص: البيانات، الحكم البشري، تحديد تكلفة الأخطاء، التنفيذ. بدائله: التنبؤ البشري الروتيني (تقدير الطلب بالحدس، فرز الطلبات يدويًا).',
      'لذلك السؤال الإداري الصحيح ليس «هل الآلة أدق؟» بل: «ما تكلفة الإيجابي الكاذب والسلبي الكاذب في هذا القرار بالضبط؟» رفض زبون جيد يكلف هامش قرض؛ قبول زبون سيئ يكلف أصل القرض كله. من يحدد هذين الرقمين يملك القرار، والآلة لا تحددهما.'],
      en:['Economically, AI is one thing: <b>a sharp drop in the cost of prediction</b>. And every decision has two parts: <b>prediction</b> (what will happen? 12% probability the customer defaults) and <b>judgement</b> (what do we prefer, and what does each type of error cost us?). The machine dominates the first, so the second becomes scarcer and dearer.',
      'The economics rule: when something gets cheaper, demand rises for its <b>complements</b> and falls for its <b>substitutes</b>. Complements of cheap prediction: data, human judgement, costing the errors, execution. Substitutes: routine human prediction (guessing demand by gut, sorting applications by hand).',
      'So the right managerial question is not "is the machine more accurate?" but "what exactly do a false positive and a false negative cost in this decision?" Rejecting a good customer costs a loan margin; accepting a bad one costs the whole principal. Whoever sets those two numbers owns the decision, and the machine does not set them.']},
    lesson:{ar:'«الآلة تقرر بشكل أفضل» خطأ في الصياغة: الآلة تتنبأ؛ القرار يحتاج حكمًا عن تكلفة كل خطأ، وهو عمل اقتصادي بشري.',en:'"The machine decides better" is a category error: the machine predicts; the decision needs a judgement about the cost of each error, and that is human economic work.'},
    terms:[
      {en:'Prediction vs. judgment',fr:'Prédiction vs jugement',ar:'التنبؤ مقابل الحكم',s:{ar:'التنبؤ: ما سيحدث وباحتمال كم. الحكم: ماذا نفضّل وكم يكلف كل خطأ.',en:'Prediction: what will happen and with what probability. Judgement: what we prefer and what each error costs.'},c:{ar:'الآلة تهيمن على الأول فيغلو الثاني.',en:'The machine dominates the first, so the second appreciates.'}},
      {en:'Complements / Substitutes',fr:'Compléments / Substituts',ar:'المكمّلات والبدائل',s:{ar:'حين ينخفض سعر التنبؤ يرتفع طلب مكمّلاته (بيانات، حكم، تنفيذ) وينخفض طلب بدائله (التنبؤ البشري الروتيني).',en:'When prediction gets cheaper, demand for its complements (data, judgement, execution) rises and for its substitutes (routine human prediction) falls.'},c:{ar:'مفتاح قراءة أثر الذكاء الاصطناعي على أي مهنة.',en:'The key to reading AI\'s effect on any profession.'}},
      {en:'False positive / False negative',fr:'Faux positif / Faux négatif',ar:'الإيجابي الكاذب / السلبي الكاذب',s:{ar:'إنذار خاطئ (رفض زبون جيد) مقابل تفويت حقيقي (قبول زبون سيئ)؛ لكل واحد تكلفة مختلفة.',en:'A false alarm (rejecting a good customer) versus a miss (accepting a bad one); each has a different cost.'},c:{ar:'تحديد التكلفتين هو الحكم بعينه.',en:'Costing the two is judgement itself.'}},
      {en:'Cost of errors',fr:'Coût des erreurs',ar:'تكلفة الأخطاء',s:{ar:'الخسارة الفعلية من كل نوع خطأ؛ تحدد أين توضع عتبة القرار.',en:'The actual loss from each type of error; determines where the decision threshold sits.'},c:{ar:'الدقة الإجمالية تخفي هذا التباين.',en:'Overall accuracy hides this asymmetry.'}}],
    activity:{id:'claims',title:{ar:'قراءة اقتصادية لا تسويقية',en:'An economist\'s reading, not a marketer\'s'},
      text:{ar:'ستة ادعاءات تسمعها في العروض والمقالات. حدد لكل ادعاء: سليم اقتصاديًا، أم يحتاج تحققًا (تسويق أو خطأ تصوّر)؟',en:'Six claims you hear in pitches and articles. Mark each: economically sound, or in need of checking (marketing or misconception)?'},
      claims:[
        {t:{ar:'«الذكاء الاصطناعي هو أساسًا انخفاض في تكلفة التنبؤ.»',en:'"AI is essentially a drop in the cost of prediction."'},bad:false,why:{ar:'التعريف الاقتصادي الذي يفسر أين يخلق قيمة.',en:'The economic definition that explains where it creates value.'}},
        {t:{ar:'«الآلة تقرر بشكل أفضل من المدير.»',en:'"The machine decides better than the manager."'},bad:true,why:{ar:'الآلة تتنبأ؛ القرار يحتاج حكمًا عن تكلفة الأخطاء.',en:'The machine predicts; the decision needs a judgement about error costs.'}},
        {t:{ar:'«كلما رخص التنبؤ ارتفعت قيمة الحكم البشري والبيانات.»',en:'"The cheaper prediction gets, the more human judgement and data are worth."'},bad:false,why:{ar:'منطق المكمّلات.',en:'The logic of complements.'}},
        {t:{ar:'«نموذجنا بدقة 97% فاستبدلوا لجنة الائتمان.»',en:'"Our model is 97% accurate, so replace the credit committee."'},bad:true,why:{ar:'الدقة الإجمالية لا تقول شيئًا عن تكلفة كل خطأ ولا عن البيانات غير المرئية.',en:'Overall accuracy says nothing about each error\'s cost or about unseen data.'}},
        {t:{ar:'«السؤال الأول في أي مشروع: كم يكلفنا الإيجابي الكاذب والسلبي الكاذب؟»',en:'"The first question in any project: what do a false positive and a false negative cost us?"'},bad:false,why:{ar:'هذا هو الحكم الذي لا تؤديه الآلة.',en:'That is the judgement the machine cannot perform.'}},
        {t:{ar:'«سيختفي 47% من الوظائف خلال عقد.»',en:'"47% of jobs will disappear within a decade."'},bad:true,why:{ar:'الرقم عن الوظائف لا المهام؛ منهج المهام يعطي صورة أدق (الجولة 4).',en:'The figure is about jobs, not tasks; the task framework gives a truer picture (Round 4).'}}]},
    qs:[
      {k:'mcq',q:{ar:'اقتصاديًا، الذكاء الاصطناعي هو:',en:'Economically, AI is:'},o:{ar:['ارتفاع في تكلفة العمل','انخفاض في تكلفة التنبؤ','ارتفاع في تكلفة البيانات','انخفاض في تكلفة الحكم'],en:['A rise in the cost of labour','A drop in the cost of prediction','A rise in the cost of data','A drop in the cost of judgement']},a:1,w:{ar:'والحكم مكمّل يغلو.',en:'And judgement is a complement that appreciates.'}},
      {k:'multi',q:{ar:'مكمّلات التنبؤ الرخيص (3 إجابات):',en:'Complements of cheap prediction (3 answers):'},o:{ar:['البيانات','الحكم البشري','التنبؤ البشري الروتيني','التنفيذ'],en:['Data','Human judgement','Routine human prediction','Execution']},a:[0,1,3],w:{ar:'التنبؤ البشري الروتيني بديل ينخفض طلبه.',en:'Routine human prediction is a substitute whose demand falls.'}},
      {k:'tf',q:{ar:'رفض زبون جيد وقبول زبون سيئ لهما التكلفة نفسها على البنك.',en:'Rejecting a good customer and accepting a bad one cost the bank the same.'},a:false,w:{ar:'الأول يكلف هامشًا؛ الثاني يكلف أصل القرض.',en:'The first costs a margin; the second costs the principal.'}}]},

  { id:'s2', n:'2', t:{ar:'عرض المورّد: «دقة 98% على الأسواق»',en:'The vendor pitch: "98% accurate on markets"'}, y:{ar:'المالية والبنوك: أكبر مستعمل وأكثر الأوهام',en:'Finance and banking: biggest user, most illusions'},
    story:{ar:['المالية أكبر مستعمل للذكاء الاصطناعي وأكثر قطاع تحيط به الأوهام. أنجح استعمالاته أقل إبهارًا: <b>كشف الاحتيال</b> (ملايين المعاملات في الثانية، أنماط لا يراها الإنسان)، <b>التقييم الائتماني</b> على بيانات أوسع، <b>مكافحة غسيل الأموال</b>، وأتمتة المعالجة الإدارية.',
      'أما وعد «التنبؤ بالأسواق» فيصطدم بأربعة حوائط من اقتصاد السنة الثانية: <b>الإفراط في التكيّف (Overfitting)</b>: دقة على بيانات رآها النموذج لا تعني شيئًا؛ <b>فرضية كفاءة السوق</b>: إن استعمل الجميع النمط المربح نفسه اختفى؛ <b>الصدمات</b>: مارس 2020 ليس في بيانات 2015–2019؛ <b>الخطر النظامي</b>: إن باعت كل البنوك عند الإشارة نفسها حدث انهيار خاطف (Flash crash).',
      '<b>التداول الخوارزمي</b> موجود وضخم، لكن ربحه من السرعة والتنفيذ أكثر من «التوقع»، وهو لعبة من يملك أسرع كابل لا أذكى نموذج. المدير الذي يعرف هذه الحوائط الأربعة يسأل المورّد الأسئلة الأربعة قبل أن ينبهر بالنسبة.'],
      en:['Finance is AI\'s biggest user and the sector most surrounded by illusions. Its most successful uses are the least glamorous: <b>fraud detection</b> (millions of transactions a second, patterns no human sees), <b>credit scoring</b> on wider data, <b>anti-money-laundering</b>, and back-office automation.',
      'The "predict the markets" promise, by contrast, hits four walls from second-year economics: <b>overfitting</b>: accuracy on data the model has seen means nothing; the <b>efficient market hypothesis</b>: if everyone uses the same profitable pattern it vanishes; <b>shocks</b>: March 2020 is not in 2015–2019 data; <b>systemic risk</b>: if every bank sells on the same signal you get a flash crash.',
      '<b>Algorithmic trading</b> exists and is huge, but its profit comes from speed and execution more than "forecasting"; it is a game of who owns the fastest cable, not the smartest model. A manager who knows the four walls asks the vendor the four questions before being dazzled by the percentage.']},
    lesson:{ar:'دقة النموذج على الماضي لا تضمن الربح في المستقبل: اختبر على بيانات لم يرها، وتوقع الفشل في الأزمات.',en:'A model\'s accuracy on the past does not guarantee profit in the future: test on unseen data and expect failure in crises.'},
    terms:[
      {en:'Overfitting',fr:'Surapprentissage',ar:'الإفراط في التكيّف',s:{ar:'نموذج حفظ بيانات الماضي بتفاصيلها بدل تعلم القاعدة؛ دقيق على ما رآه، فاشل على الجديد.',en:'A model that memorised past data in detail instead of learning the rule; accurate on what it saw, failing on the new.'},c:{ar:'اسأل دائمًا: دقة على بيانات رآها أم لم يرها؟',en:'Always ask: accuracy on seen or unseen data?'}},
      {en:'Efficient Market Hypothesis',fr:'Efficience des marchés',ar:'فرضية كفاءة السوق',s:{ar:'الأسعار تعكس المعلومات المتاحة؛ أي نمط مربح معروف يستهلكه السوق ويختفي.',en:'Prices reflect available information; any known profitable pattern gets arbitraged away.'},c:{ar:'لذلك لا يُباع نموذج يربح فعلًا لكل البنوك.',en:'Hence a model that truly profits is never sold to every bank.'}},
      {en:'Systemic risk',fr:'Risque systémique',ar:'الخطر النظامي',s:{ar:'انتقال خطر من مؤسسة إلى النظام كله؛ النماذج المتشابهة تجعل الجميع يتصرف معًا.',en:'Risk spreading from one institution to the whole system; similar models make everyone act together.'},c:{ar:'الانهيار الخاطف (Flash crash) مثاله.',en:'The flash crash is its example.'}},
      {en:'Algorithmic trading',fr:'Trading algorithmique',ar:'التداول الخوارزمي',s:{ar:'برامج تنفذ أوامر البيع والشراء آليًا بسرعة فائقة وفق قواعد أو نماذج.',en:'Programs executing buy and sell orders automatically at extreme speed by rules or models.'},c:{ar:'ربحه من السرعة والتنفيذ أكثر من التوقع.',en:'Its profit is from speed and execution more than forecasting.'}},
      {en:'Fraud detection',fr:'Détection de fraude',ar:'كشف الاحتيال',s:{ar:'تصنيف المعاملات المشبوهة لحظيًا من أنماط السلوك؛ أنجح استعمال للذكاء الاصطناعي في البنوك.',en:'Real-time flagging of suspicious transactions from behaviour patterns; AI\'s most successful banking use.'},c:{ar:'يحتاج مراجعة بشرية للإنذارات الكاذبة.',en:'Needs human review of false alarms.'}},
      {en:'Credit scoring',fr:'Notation de crédit',ar:'التقييم الائتماني',s:{ar:'تقدير احتمال تخلف المقترض عن السداد؛ النموذج يتنبأ والبنك يحكم بالعتبة.',en:'Estimating a borrower\'s probability of default; the model predicts and the bank sets the threshold.'},c:{ar:'يخضع لقواعد الإنصاف (الوحدة 8).',en:'Subject to fairness rules (Module 8).'}}],
    activity:{id:'scenario',title:{ar:'أنت مدير المخاطر في بنك',en:'You are a bank\'s risk manager'},
      meters:[{id:'cap',t:{ar:'رأس المال',en:'Capital'},start:80},{id:'rep',t:{ar:'سمعة البنك',en:'Bank reputation'},start:70},{id:'board',t:{ar:'ثقة مجلس الإدارة',en:'Board confidence'},start:60}],
      scenes:[
        {text:{ar:'مورّد يعرض «نموذجًا توقّع أسعار الأسهم بدقة 98% على بيانات 2015–2023» ويريد بيعه لبنكك ولكل البنوك. أول سؤالك؟',en:'A vendor offers "a model that predicted stock prices with 98% accuracy on 2015–2023 data" and wants to sell it to your bank and every other bank. Your first question?'},
         choices:[
          {t:{ar:'«كم السعر؟ نوقّع هذا الأسبوع قبل المنافسين»',en:'"What\'s the price? We sign this week before the competitors"'},fx:{cap:-20,board:10},good:false,why:{ar:'انبهار بالنسبة قبل فهمها. 98% على بيانات رآها النموذج قد تعني صفرًا على الجديد.',en:'Dazzled by the number before understanding it. 98% on data the model saw may mean zero on new data.'}},
          {t:{ar:'«هل الدقة على بيانات رآها النموذج في التدريب أم على بيانات لم يرها؟»',en:'"Is that accuracy on data the model trained on, or on data it never saw?"'},fx:{board:5,rep:5},good:true,why:{ar:'سؤال الإفراط في التكيّف: الاختبار الوحيد المعتبر على بيانات غير مرئية.',en:'The overfitting question: the only test that counts is on unseen data.'}},
          {t:{ar:'«أي لغة برمجة استعملتم؟»',en:'"Which programming language did you use?"'},fx:{board:-5},good:false,why:{ar:'تفصيل تقني لا يغيّر الحكم الاقتصادي.',en:'A technical detail that changes nothing in the economic judgement.'}}]},
        {text:{ar:'المورّد: «دقة 91% على بيانات 2024 التي لم يرها». وسيبيعه أيضًا لثمانية بنوك أخرى. رأيك؟',en:'Vendor: "91% on 2024 data it never saw." He will also sell it to eight other banks. Your view?'},
         choices:[
          {t:{ar:'ممتاز، 91% على بيانات جديدة يكفي؛ نشتري',en:'Excellent, 91% on new data is enough; we buy'},fx:{cap:-15},good:false,why:{ar:'إن استعملت تسعة بنوك النمط نفسه اختفى ربحه (كفاءة السوق) وتحركت كلها معًا (خطر نظامي).',en:'If nine banks use the same pattern its profit vanishes (market efficiency) and they all move together (systemic risk).'}},
          {t:{ar:'«ماذا يحدث للنمط المربح حين تستعمله تسعة بنوك في آن؟ وماذا فعل النموذج في مارس 2020؟»',en:'"What happens to the profitable pattern when nine banks use it at once? And what did the model do in March 2020?"'},fx:{board:10,rep:5},good:true,why:{ar:'سؤالا كفاءة السوق والصدمات: النمط المعروف يختفي، والجائحة ليست في البيانات.',en:'The market-efficiency and shock questions: a known pattern vanishes, and the pandemic is not in the data.'}},
          {t:{ar:'نطلب حصرية: نشتري بشرط ألا يبيعه لغيرنا',en:'We demand exclusivity: buy on condition he sells to no one else'},fx:{cap:-10,board:5},good:false,why:{ar:'أفضل من الشراء الأعمى، لكن سؤال الصدمات والإفراط ما زال بلا جواب؛ ومن يملك نموذجًا يربح فعلًا لا يبيعه.',en:'Better than blind buying, but the shock and overfitting questions remain unanswered; and whoever owns a model that truly profits does not sell it.'}}]},
        {text:{ar:'مجلس الإدارة يضغط: «المنافسون يستعملون الذكاء الاصطناعي ونحن متأخرون!». أين توجّه ميزانية الذكاء الاصطناعي هذا العام؟',en:'The board presses: "Competitors use AI and we are behind!" Where do you direct this year\'s AI budget?'},
         choices:[
          {t:{ar:'نموذج تنبؤ بالأسواق لمحفظة البنك',en:'A market-forecasting model for the bank\'s portfolio'},fx:{cap:-20,rep:-10},good:false,why:{ar:'الاستعمال الأكثر إبهارًا والأقل موثوقية.',en:'The most glamorous and least reliable use.'}},
          {t:{ar:'كشف الاحتيال في المعاملات والتقييم الائتماني مع مراجعة بشرية للعتبات',en:'Transaction fraud detection and credit scoring with human-set thresholds'},fx:{cap:10,rep:10,board:10},good:true,why:{ar:'أنجح استعمالات الذكاء الاصطناعي في البنوك: أقل إبهارًا وأكثر ربحًا.',en:'AI\'s most successful banking uses: least glamorous, most profitable.'}},
          {t:{ar:'روبوت محادثة يرد على كل الزبائن بلا مراجعة',en:'A chatbot answering every customer with no review'},fx:{rep:-15},good:false,why:{ar:'أخطاء الروبوت في المسائل المالية تكلف السمعة؛ يحتاج تدرجًا ومراجعة.',en:'Chatbot errors on financial matters cost reputation; needs gradual rollout and review.'}}]},
        {text:{ar:'نظام كشف الاحتيال يعمل. فريق العمليات يشكو: «90% من الإنذارات كاذبة وتعطّل بطاقات زبائن أبرياء». ما قرارك؟',en:'The fraud system is live. Operations complains: "90% of alerts are false and block innocent customers\' cards." Your decision?'},
         choices:[
          {t:{ar:'أوقف النظام؛ النسبة مخيفة',en:'Shut the system down; the rate is alarming'},fx:{cap:-15,board:-10},good:false,why:{ar:'الاحتيال الذي يمنعه قد يفوق كلفة الإنذارات بكثير؛ القرار يحتاج تكلفة كل خطأ لا رد فعل.',en:'The fraud it blocks may far outweigh the alert cost; the decision needs error costs, not a reflex.'}},
          {t:{ar:'أحسب تكلفة الإيجابي الكاذب (زبون مزعج) والسلبي الكاذب (احتيال يمر) وأعدّل العتبة وفقها مع مراجعة بشرية للحالات الحدّية',en:'Cost the false positive (an annoyed customer) and the false negative (fraud passing), tune the threshold accordingly, with human review of borderline cases'},fx:{cap:5,rep:10,board:10},good:true,why:{ar:'هذا هو الحكم: الآلة تتنبأ وأنت تحدد تكلفة كل خطأ وتضع العتبة.',en:'That is judgement: the machine predicts; you cost each error and set the threshold.'}},
          {t:{ar:'أطلب من المورّد «رفع الدقة إلى 100%»',en:'Ask the vendor to "raise accuracy to 100%"'},fx:{board:-5},good:false,why:{ar:'لا يوجد كاشف بلا أخطاء؛ المفاضلة بين نوعي الخطأ حتمية.',en:'No detector is error-free; the trade-off between the two errors is inevitable.'}}]}],
      ending:(m,g)=>g>=4?{ar:'بنكك لم يشترِ الوهم واستثمر حيث يربح الذكاء الاصطناعي فعلًا. أربعة أسئلة من اقتصاد السنة الثانية حمت رأس المال.',en:'Your bank bought no illusions and invested where AI truly pays. Four second-year economics questions protected the capital.'}:m.cap<60?{ar:'خسر البنك رأس مال على نسب مبهرة. الدرس: الدقة على الماضي، وكفاءة السوق، والصدمات، والخطر النظامي تكسر وعد التنبؤ بالأسواق.',en:'The bank lost capital on dazzling percentages. The lesson: past accuracy, market efficiency, shocks and systemic risk break the market-forecasting promise.'}:{ar:'قرارات متوسطة: نجوت لكن بعض الأسئلة بقيت بلا جواب. احفظ الأسئلة الأربعة.',en:'Mixed decisions: you survived, but some questions went unanswered. Memorise the four questions.'}},
    qs:[
      {k:'mcq',q:{ar:'لماذا يختفي نمط مربح حين تستعمله كل البنوك؟',en:'Why does a profitable pattern vanish when every bank uses it?'},o:{ar:['بسبب الإفراط في التكيّف','بسبب كفاءة السوق: الأسعار تمتص المعلومة','لأن النموذج يتعب','لا يختفي'],en:['Because of overfitting','Because of market efficiency: prices absorb the information','Because the model tires','It does not vanish']},a:1,w:{ar:'ولو تحرّك الجميع معًا صار خطرًا نظاميًا.',en:'And if all move together it becomes systemic risk.'}},
      {k:'mcq',q:{ar:'أنجح استعمالات الذكاء الاصطناعي في البنوك:',en:'AI\'s most successful uses in banking:'},o:{ar:['التنبؤ بأسعار الأسهم','كشف الاحتيال والتقييم الائتماني','كتابة التقارير السنوية','تصميم الشعارات'],en:['Forecasting stock prices','Fraud detection and credit scoring','Writing annual reports','Designing logos']},a:1,w:{ar:'أقل إبهارًا وأكثر ربحًا.',en:'Least glamorous, most profitable.'}},
      {k:'tf',q:{ar:'دقة 98% على بيانات 2015–2023 التي تدرّب عليها النموذج تثبت أنه سيربح في 2026.',en:'98% accuracy on the 2015–2023 data the model trained on proves it will profit in 2026.'},a:false,w:{ar:'إفراط في التكيّف محتمل؛ الاختبار على بيانات غير مرئية والصدمات غير مضمونة.',en:'Likely overfitting; only unseen-data tests count, and shocks are never guaranteed.'}}]},

  { id:'s3', n:'3', t:{ar:'محاكي التسعير الديناميكي',en:'The dynamic-pricing simulator'}, y:{ar:'التسويق والعمليات: حيث يتحقق أغلب الوفر',en:'Marketing and operations: where most savings happen'},
    story:{ar:['في التسويق والعمليات يتحقق أغلب الوفر الحقيقي: <b>التنبؤ بالطلب</b> (كم نخزّن؟)، <b>أنظمة التوصية</b> (ترتيب المنتجات لكل مستعمل)، <b>التنبؤ بمغادرة الزبون (Churn)</b> مقيدًا بـ<b>قيمته الدائمة (CLV)</b>: لا تنفق على استبقاء زبون لا يدر شيئًا، و<b>أتمتة العمليات (RPA)</b> للمهام الإدارية المتكررة.',
      '<b>التسعير الديناميكي</b>: سعر يتغير مع الطلب اللحظي (النقل، الفنادق، الطيران). اقتصاديًا يقرّب السوق من التوازن أسرع ويقلل الانتظار: حين يرتفع الطلب يرفع السعر فيخرج من لا يستعجل ويدخل سائقون إضافيون. ليس «جشعًا» بذاته.',
      'لكن له حدًا: حين يستغل <b>الطوارئ</b> (عاصفة، حادث) يصير رفع السعر استغلالًا للضرورة لا توازنًا، ويتدخل التنظيم (سقف سعري) وتتضرر السمعة. المدير الجيد يعرف أين ينتهي الاقتصاد ويبدأ الإنصاف. وفي السياسة الاقتصادية الصورة نفسها: <b>التنبؤ الآني (Nowcasting)</b> و<b>البيانات البديلة</b> (بطاقات، هواتف، أقمار) تسبق الإحصاء الرسمي لكنها تمثل من يستعمل الأدوات الرقمية فقط؛ السؤال الدائم: من ليس في البيانات؟'],
      en:['Marketing and operations are where most real savings happen: <b>demand forecasting</b> (how much to stock?), <b>recommender systems</b> (ranking products per user), <b>churn prediction</b> bounded by <b>customer lifetime value (CLV)</b>: do not spend retaining a customer who yields nothing, and <b>RPA</b> for repetitive admin tasks.',
      '<b>Dynamic pricing</b>: a price that moves with real-time demand (transport, hotels, airlines). Economically it brings the market to equilibrium faster and cuts waiting: when demand spikes the price rises, the unhurried drop out and extra drivers come in. Not "greed" in itself.',
      'But it has a limit: when it exploits <b>emergencies</b> (a storm, an accident) the price rise becomes exploitation of necessity, not equilibrium; regulators step in (a price cap) and reputation suffers. A good manager knows where economics ends and fairness begins. Economic policy shows the same picture: <b>nowcasting</b> and <b>alternative data</b> (cards, phones, satellites) run ahead of official statistics but represent only those who use digital tools; the standing question: who is not in the data?']},
    lesson:{ar:'التسعير الديناميكي يقرّب من التوازن ويقلل الانتظار؛ يصبح غير مقبول حين يستغل الطوارئ، وهنا يتدخل التنظيم.',en:'Dynamic pricing nears equilibrium and cuts waiting; it becomes unacceptable when it exploits emergencies, and that is where regulation steps in.'},
    terms:[
      {en:'Dynamic pricing',fr:'Tarification dynamique',ar:'التسعير الديناميكي',s:{ar:'سعر يتغير آليًا مع الطلب والعرض اللحظيين.',en:'A price that changes automatically with real-time demand and supply.'},c:{ar:'توازن أسرع، بحدود إنصاف في الطوارئ.',en:'Faster equilibrium, within fairness limits in emergencies.'}},
      {en:'Recommender system',fr:'Système de recommandation',ar:'نظام التوصية',s:{ar:'ترتيب المنتجات أو المحتوى لكل مستعمل من سلوكه وسلوك أشباهه.',en:'Ranking products or content per user from their behaviour and that of similar users.'},c:{ar:'محرك مبيعات التجارة الإلكترونية.',en:'The sales engine of e-commerce.'}},
      {en:'Churn',fr:'Attrition',ar:'مغادرة الزبون',s:{ar:'انتقال الزبون إلى منافس؛ يُتنبأ به ليُستبقى قبل أن يغادر.',en:'A customer leaving for a competitor; predicted so they can be retained before leaving.'},c:{ar:'استبقِ من يستحق فقط (CLV).',en:'Retain only those worth it (CLV).'}},
      {en:'Customer Lifetime Value (CLV)',fr:'Valeur vie client',ar:'القيمة الدائمة للزبون',s:{ar:'ما يدره الزبون للمؤسسة طوال علاقته بها.',en:'What a customer yields the firm over the whole relationship.'},c:{ar:'سقف ما يجوز إنفاقه لاستبقائه.',en:'The ceiling on what may be spent to retain them.'}},
      {en:'RPA (Robotic Process Automation)',fr:'Automatisation robotisée des processus',ar:'أتمتة العمليات الروبوتية',s:{ar:'برامج تنفذ مهامًا إدارية متكررة (نقل بيانات، فواتير) بلا ذكاء كبير.',en:'Software executing repetitive admin tasks (data entry, invoices) with little intelligence.'},c:{ar:'كثير مما يُسمى «ذكاءً اصطناعيًا» في المؤسسات هو RPA.',en:'Much of what firms call "AI" is RPA.'}},
      {en:'Nowcasting / Alternative data',fr:'Prévision immédiate / Données alternatives',ar:'التنبؤ الآني / البيانات البديلة',s:{ar:'تقدير الحاضر الاقتصادي من بيانات فورية (بطاقات، هواتف، أقمار) قبل الإحصاء الرسمي.',en:'Estimating the economic present from instant data (cards, phones, satellites) before official statistics.'},c:{ar:'منحازة نحو الرقميين؛ من ليس في البيانات؟',en:'Biased towards the digital; who is not in the data?'}}],
    activity:{id:'pricing',title:{ar:'سعّر الرحلة في ثلاث حالات',en:'Price the ride in three situations'},
      sits:[
        {t:{ar:'ثلاثاء عادي 10:00',en:'An ordinary Tuesday 10:00'},text:{ar:'طلب عادي. السعر المرجعي 200 دج. ابحث عن السعر الذي يوازن الطلب مع السعة تقريبًا بلا انتظار طويل ولا سيارات فارغة.',en:'Normal demand. Reference price 200 DZD. Find the price that roughly balances demand with capacity: no long waits, no empty cars.'},d0:100,e:1.2,cap:100,lo:170,hi:240,okWhy:{ar:'قرب التوازن: الطلب ≈ السعة.',en:'Near equilibrium: demand ≈ capacity.'},badWhy:{ar:'بعيد عن التوازن: إما انتظار طويل أو سيارات فارغة.',en:'Far from equilibrium: either long waits or empty cars.'}},
        {t:{ar:'الخميس 17:30 بعد مباراة',en:'Thursday 17:30 after a match'},text:{ar:'الطلب يقارب الضعف. السعر الأعلى يُخرج من لا يستعجل ويُدخل سائقين إضافيين. أين التوازن الجديد؟',en:'Demand nearly doubles. A higher price drops the unhurried and brings in extra drivers. Where is the new equilibrium?'},d0:180,e:1.2,cap:110,lo:270,hi:400,okWhy:{ar:'رفع السعر وفق الطلب قرّب السوق من التوازن وقلل الانتظار: تسعير ديناميكي سليم.',en:'Raising the price with demand neared equilibrium and cut waiting: sound dynamic pricing.'},badWhy:{ar:'إما سعر منخفض فانتظار طويل، أو مرتفع جدًا فسيارات فارغة.',en:'Either too low (long waits) or too high (empty cars).'}},
        {t:{ar:'ليلة عاصفة وانقطاع القطار',en:'A stormy night, trains cut'},text:{ar:'طلب ثلاثة أضعاف وغير مرن: الناس مضطرون. الخوارزمية تقترح 900 دج. التنظيم يحدد سقفًا 300 دج في الطوارئ، والسمعة على المحك. قرارك؟',en:'Demand triples and is inelastic: people are desperate. The algorithm suggests 900 DZD. Regulation caps emergency prices at 300 DZD, and reputation is at stake. Your decision?'},d0:300,e:0.5,cap:110,capPrice:300,lo:200,hi:300,okWhy:{ar:'بقيت تحت السقف: الطلب يفوق السعة والانتظار طويل، لكنك لم تستغل الضرورة؛ توزَّع الرحلات بالطابور لا بالسعر.',en:'You stayed under the cap: demand exceeds capacity and waiting is long, but you did not exploit necessity; rides get allocated by queue, not price.'},badWhy:{ar:'تجاوز السقف: استغلال للطوارئ يتدخل فيه التنظيم ويضر بالسمعة طويلًا، وإن رفع الإيراد ليلة واحدة.',en:'Over the cap: exploiting an emergency; regulation intervenes and reputation suffers long-term, even if revenue rose for one night.'}}]},
    qs:[
      {k:'mcq',q:{ar:'اقتصاديًا، التسعير الديناميكي في أوقات الذروة العادية:',en:'Economically, dynamic pricing at ordinary peak times:'},o:{ar:['جشع دائمًا','يقرّب السوق من التوازن ويقلل الانتظار','لا أثر له','ممنوع قانونًا'],en:['Always greed','Nears equilibrium and cuts waiting','Has no effect','Illegal']},a:1,w:{ar:'حدّه الطوارئ.',en:'Its limit is emergencies.'}},
      {k:'mcq',q:{ar:'لماذا تُقيَّد حملة استبقاء الزبائن بالقيمة الدائمة للزبون؟',en:'Why bound a retention campaign by customer lifetime value?'},o:{ar:['لأن كل زبون يستحق الإنفاق نفسه','لأن الإنفاق على استبقاء زبون لا يدر شيئًا خسارة','لأن القانون يفرض ذلك','لا علاقة بينهما'],en:['Because every customer deserves the same spend','Because spending to retain a customer who yields nothing is a loss','Because the law requires it','They are unrelated']},a:1,w:{ar:'التنبؤ بالمغادرة + حكم بالقيمة.',en:'Churn prediction + a judgement on value.'}},
      {k:'tf',q:{ar:'البيانات البديلة (بطاقات، هواتف) تمثل الاقتصاد الجزائري كله.',en:'Alternative data (cards, phones) represents the whole Algerian economy.'},a:false,w:{ar:'تمثل من يستعمل الأدوات الرقمية؛ الاقتصاد النقدي وغير الرسمي خارجها.',en:'It represents digital-tool users; the cash and informal economy is outside it.'}}]},

  { id:'s4', n:'4', t:{ar:'الوظائف مهامًا والجزائر',en:'Jobs as tasks, and Algeria'}, y:{ar:'سوق العمل والفرص والقيود',en:'The labour market, opportunities and constraints'},
    story:{ar:['«سيختفي 47% من الوظائف»: الرقم الشهير عن <b>الوظائف</b>، والآلة لا تؤتمت وظائف بل <b>مهامًا</b>. <b>منهج المهام</b>: الوظيفة حزمة مهام؛ بعضها <b>يُؤتمت</b> (الروتيني الذهني: إدخال بيانات، مطابقة فواتير، صياغة أولى)، وبعضها <b>يُعزَّز</b> (الإنسان مع الآلة: تحليل، تقرير)، وبعضها <b>يبقى بشريًا</b> لأنه حكم أو تفاوض أو سياق أو مسؤولية.',
      'المفارقة: الروتيني الذهني (المحاسب المبتدئ، المترجم العام) أكثر تعرضًا من كثير من المهن اليدوية (السبّاك). وأثر الذكاء الاصطناعي على <b>إنتاجية العمل</b> الكلية ما زال متواضعًا ومتأخرًا في الإحصاءات (مفارقة الإنتاجية: كما الكهرباء، تحتاج إعادة تنظيم العمل لا مجرد تركيب الأداة).',
      'في الجزائر: الفرص في المهام ذات الحجم الكبير والقواعد الواضحة (الفواتير، خدمة الزبائن من الدرجة الأولى، التنبؤ بالطلب في التوزيع، كشف الاحتيال في البنوك)؛ والقيود: البيانات غير الرقمية أو المبعثرة، الاقتصاد النقدي وغير الرسمي الكبير خارج البيانات، نقص المهارات، واللغة (الدارجة والأمازيغية ضعيفتان في النماذج). الخطوة الأولى لمعظم المؤسسات ليست نموذجًا بل <b>رقمنة البيانات</b> وتنظيمها.'],
      en:['"47% of jobs will disappear": the famous figure is about <b>jobs</b>, and machines automate not jobs but <b>tasks</b>. The <b>task-based framework</b>: a job is a bundle of tasks; some get <b>automated</b> (routine cognitive work: data entry, invoice matching, first drafts), some get <b>augmented</b> (human with machine: analysis, reporting), and some <b>stay human</b> because they are judgement, negotiation, context or accountability.',
      'The paradox: routine cognitive work (the junior accountant, the generalist translator) is more exposed than many manual trades (the plumber). And AI\'s effect on aggregate <b>labour productivity</b> remains modest and lagging in the statistics (the productivity paradox: like electricity, it needs work reorganisation, not just installing the tool).',
      'In Algeria: opportunities lie in high-volume, clear-rule tasks (invoices, first-line customer service, demand forecasting in distribution, fraud detection in banks); the constraints: non-digital or scattered data, a large cash and informal economy outside the data, skills shortages, and language (Darja and Tamazight are weak in the models). For most firms the first step is not a model but <b>digitising and organising data</b>.']},
    lesson:{ar:'الآلة تؤتمت مهامًا لا وظائف؛ الروتيني الذهني الأكثر تعرضًا، والحكم والتفاوض والسياق ترتفع قيمتها.',en:'Machines automate tasks, not jobs; routine cognitive work is most exposed, while judgement, negotiation and context appreciate.'},
    terms:[
